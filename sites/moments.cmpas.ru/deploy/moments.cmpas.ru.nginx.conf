# /etc/nginx/sites-available/moments.cmpas.ru
#
# Standalone static vhost for the МОМЕНТЫ promo page. Fully isolated from the
# cmpas.ru vhost — matched by server_name, its own docroot. Serving static
# files directly; no proxy_pass, so the Next.js app / Docker stack is untouched.
#
# certbot --nginx (see SETUP.md) will add the listen 443 / ssl_certificate lines
# and the http->https redirect automatically the first time you issue the cert.

server {
    listen 80;
    listen [::]:80;
    server_name moments.cmpas.ru;

    root /var/www/moments.cmpas.ru;
    index index.html;

    # SPA-less static site: serve the file, fall back to 404 (not to cmpas.ru).
    location / {
        try_files $uri $uri/ =404;
    }

    # Ensure Android gets the right content type / download behaviour for the APK.
    location ~ \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="momenty-latest.apk"';
    }

    # Long-cache the immutable-ish assets; keep HTML uncached so updates show up.
    location ~* \.(css|svg|png|jpg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    access_log /var/log/nginx/moments.cmpas.ru.access.log;
    error_log  /var/log/nginx/moments.cmpas.ru.error.log;
}
