# Диагностика: почему бот молчит.
#
# Заведена 07.09.2026, когда пересланный боту контакт не дал никакого
# ответа. Пять гипотез по коду не дали ничего; ответ нашёлся здесь за три
# прогона, и он оказался снаружи кода: Telegram не мог к нам подключиться
# и держал обновление в очереди, повторяя попытки. Отличить такое от
# поломки бота по симптому невозможно — снаружи и то и другое выглядит
# как «бот молчит».
#
# Что она отвечает, по порядку сужения:
#   1. тот ли код развёрнут;
#   2. на месте ли то, на что этот код опирается (таблица, миграция);
#   3. дошло ли обновление до приложения и не ругнулось ли оно;
#   4. что о нас думает сам Telegram — копится ли очередь, какая была
#      последняя ошибка доставки;
#   5. доходят ли запросы Telegram хотя бы до nginx, жива ли дверь.
#
# Первые четыре разделяют «сломан бот» и «не дошло». Пятый разделяет «не
# доходят пакеты» и «доходят, но мы слишком медленные»: нет строк в
# журнале nginx — сеть, есть с 499 или 504 — мы.
#
# Запускается ТОЛЬКО руками (workflow_dispatch). Ни push, ни расписания —
# выкладку не задевает и сама по себе не запускается.
#
# ТОЛЬКО ЧТЕНИЕ: ни одной команды, которая что-либо создаёт, меняет,
# перезапускает или удаляет. Персональные данные не печатаются — из базы
# берутся только имена таблиц и количество строк, из журнала nginx время,
# код и размер по одному известному пути, из журнала приложения строки
# про вебхук (в них по построению нет ни текста, ни callback_data) и
# ошибки.
name: Bot doctor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Почему бот молчит
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Независимая точка: раннер GitHub снаружи и сервера, и песочницы
      # агента. Если отсюда сайт открывается, а Telegram получает
      # «Connection timed out» — значит недоступны мы именно для Telegram,
      # а не для интернета вообще.
      - name: Доступен ли сайт снаружи
        run: |
          for p in / /api/telegram/webhook; do
            printf '%-26s -> ' "$p"
            curl -sS -o /dev/null -w '%{http_code} за %{time_total}s\n' \
              --max-time 25 "https://cmpas.ru$p" || echo "НЕ ОТВЕТИЛ"
          done

      # Чистый посетитель: свежий запрос без единого кеша. Отделяет «сайт
      # сломан» от «в браузере лежит страница от прошлой сборки» — второе
      # даёт в журнале «Failed to find Server Action» и белый экран с
      # Application error, и по симптому неотличимо от первого.
      - name: Открывается ли страница у чистого посетителя
        run: |
          set -o pipefail
          URL='https://cmpas.ru/diary/clients?attest=1'
          echo "### Ответ страницы"
          curl -sS -o /tmp/page.html -w 'код %{http_code}, %{size_download} байт, %{time_total}s\n' \
            --max-time 30 -L "$URL"

          echo
          echo "### Заголовок страницы"
          grep -o '<title>[^<]*</title>' /tmp/page.html | head -1 || echo "нет title"

          echo
          echo "### Есть ли в разметке след аварии"
          if grep -qF 'Application error' /tmp/page.html; then
            echo "ЕСТЬ: страница отдаёт аварию сразу, это не кеш браузера"
          else
            echo "нет — разметка нормальная"
          fi

          echo
          echo "### Отдаются ли скрипты, на которые она ссылается"
          # Пропавший chunk — вторая причина белого экрана: разметка
          # нормальная, а код к ней не загружается.
          grep -o '/_next/static/[^"]*\.js' /tmp/page.html | sort -u | head -12 > /tmp/assets.txt
          if [ ! -s /tmp/assets.txt ]; then echo "скриптов в разметке не найдено"; fi
          while read -r a; do
            printf '%-64s -> ' "$a"
            curl -sS -o /dev/null -w '%{http_code}\n' --max-time 20 "https://cmpas.ru$a" || echo "НЕ ОТВЕТИЛ"
          done < /tmp/assets.txt
          echo "--- все 200 = чистому посетителю страница отдаётся целиком"

      - name: Спросить сервер
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 8m
          script: |
            cd /var/www/cmpas.ru

            echo "### Какой коммит развёрнут"
            git log --oneline -1 2>&1 | head -1

            echo
            echo "### Есть ли таблица ClientIntakeDraft"
            # Проверка «на месте ли опора»: обработчик пересланного
            # контакта пишет сюда черновик. Не было бы таблицы — Prisma
            # бросила бы, вебхук ответил 200 и человек не увидел бы
            # ничего. 07.09.2026 гипотеза не подтвердилась (таблица была),
            # но проверка остаётся: тишина без единой жалобы — обычный
            # почерк упавшей записи в базу.
            docker exec cmpas-postgres psql -U postgres -d cmpas_db -tAc \
              "SELECT COUNT(*) FROM information_schema.tables WHERE table_name = 'ClientIntakeDraft'" 2>&1 | head -3
            echo "--- 1 = таблица есть, 0 = таблицы нет"

            echo
            echo "### Записана ли миграция как применённая"
            docker exec cmpas-postgres psql -U postgres -d cmpas_db -tAc \
              "SELECT migration_name, finished_at IS NOT NULL FROM _prisma_migrations WHERE migration_name LIKE '%client_intake%'" 2>&1 | head -3
            echo "--- пусто = миграция не применялась"

            echo
            echo "### Сколько всего миграций записано в базе против репозитория"
            docker exec cmpas-postgres psql -U postgres -d cmpas_db -tAc \
              "SELECT COUNT(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL" 2>&1 | head -2
            ls -1 prisma/migrations | grep -c '^2' 2>&1 | head -1
            echo "--- первое число: в базе, второе: папок в репозитории"

            echo
            echo "### Черновиков заведено (только количество, без данных)"
            docker exec cmpas-postgres psql -U postgres -d cmpas_db -tAc \
              'SELECT COUNT(*) FROM "ClientIntakeDraft"' 2>&1 | head -3

            echo
            echo "### Вебхук: доходят ли обновления"
            # В этих строках по построению нет ни текста, ни callback_data —
            # только номер обновления и его вид (src/app/api/telegram/webhook).
            docker logs cmpas-app --since 12h 2>&1 | grep -F '[TG Webhook]' | tail -25
            echo "--- если пусто, обновления от Telegram до приложения не доходят"

            echo
            echo "### Что Telegram думает о нашем вебхуке"
            # Спрашиваем через тоннель — с хоста напрямую хода нет.
            # Токен только в адресе запроса, в ответе его нет; адрес
            # вебхука на всякий случай прячем.
            TOKEN=$(grep '^TELEGRAM_BOT_TOKEN=' .env | cut -d= -f2-)
            curl -sS --max-time 20 --proxy http://127.0.0.1:1080 \
              "https://api.telegram.org/bot${TOKEN}/getWebhookInfo" 2>&1 \
              | sed 's/"url":"[^"]*"/"url":"<адрес вебхука>"/' | head -5
            echo "--- смотрим pending_update_count, last_error_message, allowed_updates"

            echo
            echo "### Полнота журнала приложения"
            # Если контейнер поднят недавно, «обновления не было» читать
            # нельзя — журнал просто не застал момент.
            docker logs cmpas-app 2>&1 | wc -l
            docker inspect -f '{{.State.StartedAt}}' cmpas-app 2>&1 | head -1
            echo "--- строк в журнале и когда контейнер поднят"

            echo
            echo "### Доходят ли запросы Telegram до nginx"
            # Решающая проверка. Telegram шлёт вебхук со своих сетей
            # (149.154.160.0/20 и 91.108.4.0/22). Если этих запросов нет в
            # журнале nginx — пакеты не доходят, дело в сети. Если есть с
            # кодом 499 или 504 — доходят, но мы слишком медленные.
            # Печатаем только время, код и размер: адрес вебхука без
            # параметров, персональных данных в этих строках нет.
            for f in /var/log/nginx/access.log /var/log/nginx/access.log.1; do
              [ -f "$f" ] && grep -F '/api/telegram/webhook' "$f" \
                | awk '{print $4, $9, $10}' | tail -15
            done
            echo "--- пусто = запросы Telegram до nginx не доходят"

            echo
            echo "### Дверь: nginx и порты"
            systemctl is-active nginx 2>&1 | head -1
            (ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null) | grep -E ':(80|443)\b' | head -4

            echo
            echo "### Межсетевой экран"
            (ufw status 2>/dev/null | head -8) || echo "ufw не установлен"
            (iptables -S 2>/dev/null | grep -cE 'DROP|REJECT') || true
            echo "--- число правил DROP/REJECT"

            echo
            echo "### Последние ошибки nginx"
            tail -15 /var/log/nginx/error.log 2>&1 | head -15

            echo
            echo "### Ошибки приложения за 12 часов"
            docker logs cmpas-app --since 12h 2>&1 \
              | grep -iE 'error|exception|prisma|does not exist|denied' \
              | grep -viF 'no error' | tail -30
            echo "--- если пусто, приложение не жаловалось"
