name: Deploy to Reg.ru VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}     # New VPS IP
          username: ${{ secrets.SERVER_USER }} # 'root'
          key: ${{ secrets.SSH_PRIVATE_KEY }}  # Your private key
          port: 22
          script: |
            # Check if directory exists, if not create it
            if [ ! -d "/var/www/cmpas.ru" ]; then
              mkdir -p /var/www/cmpas.ru
              # Clone if empty
              git clone git@github.com:compas-psy/cmpas.ru.git /var/www/cmpas.ru
            fi

            cd /var/www/cmpas.ru || exit

            # Pull latest changes
            git pull origin main

            # Install dependencies
            npm install

            # Build Next.js app
            npm run build

            # Restart PM2 process
            pm2 restart cmpas-app || pm2 start npm --name "cmpas-app" -- start
