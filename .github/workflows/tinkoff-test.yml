name: Самопроверка эквайринга (тестовый терминал)

# Прогоняет боевой код приёма платежей на ТЕСТОВЫХ терминалах Т-Банк и кладёт
# отчёт в docs/ops/tinkoff-test.md. Секреты не печатаются: ни ключи, ни пароли,
# ни номер карты. Ссылка на платёжную форму печатается — она не секрет и нужна
# человеку, чтобы завершить оплату тестовой картой.

on:
  workflow_dispatch:
  push:
    paths:
      - '.backup/tinkoff-test'
      - 'scripts/tinkoff-selftest.ts'
      - '.github/workflows/tinkoff-test.yml'

permissions:
  contents: write

concurrency:
  group: tinkoff-test
  cancel-in-progress: false

jobs:
  selftest:
    name: Прогнать платёж на тестовом терминале
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Боевой модуль читает TINKOFF_*; подставляем сюда ТЕСТОВЫЕ ключи.
      TINKOFF_TERMINAL_KEY: ${{ secrets.TINKOFF_TEST_TERMINAL_KEY }}
      TINKOFF_PASSWORD: ${{ secrets.TINKOFF_TEST_PASSWORD }}
      TINKOFF_APP_TERMINAL_KEY: ${{ secrets.TINKOFF_TEST_APP_TERMINAL_KEY }}
      TINKOFF_APP_PASSWORD: ${{ secrets.TINKOFF_TEST_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Проверить, что ключи вообще заданы
        run: |
          missing=0
          for k in TINKOFF_TERMINAL_KEY TINKOFF_PASSWORD; do
            if [ -z "${!k}" ]; then echo "Не задан секрет для $k"; missing=1; fi
          done
          [ "$missing" = '0' ] || { echo "Без тестовых ключей проверять нечего."; exit 1; }

      - name: Установить зависимости
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Прогнать самопроверку
        id: selftest
        continue-on-error: true
        run: npx tsx scripts/tinkoff-selftest.ts

      - name: Закоммитить отчёт
        if: always()
        run: |
          git config user.name 'simpas-doctor'
          git config user.email 'bot@users.noreply.github.com'
          git add docs/ops/tinkoff-test.md || true
          git diff --cached --quiet || git commit -m "Самопроверка эквайринга: отчёт"
          git push origin HEAD:${{ github.ref_name }} || echo "нечего пушить"

      - name: Провалить прогон, если проверки не прошли
        if: steps.selftest.outcome != 'success'
        run: exit 1
