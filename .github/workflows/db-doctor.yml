name: Диагностика базы

# Зачем это нужно.
# 17.08.2026 выкладка сломала вход, и разобраться было нечем: журналы Actions
# из рабочей среды агента не читаются. Этот прогон снимает состояние журнала
# миграций на сервере и **кладёт отчёт обратно в репозиторий** — туда, куда
# агент точно может посмотреть. Ничего не меняет: только читает.
#
# Запуск: изменить файл .backup/doctor в main, либо кнопкой в Actions.

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths: ['.backup/doctor']

permissions:
  contents: write

concurrency:
  group: db-doctor
  cancel-in-progress: false

jobs:
  doctor:
    name: Снять состояние миграций
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Опросить сервер
        id: doctor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo "### Журнал миграций: есть ли таблица"
            docker exec cmpas-postgres psql -U postgres -d cmpas_db -tAc \
              "SELECT to_regclass('public._prisma_migrations') IS NOT NULL;"
            echo "### Сколько записей и сколько незавершённых"
            docker exec cmpas-postgres psql -U postgres -d cmpas_db -tAc \
              "SELECT 'всего=' || count(*) FROM _prisma_migrations" 2>/dev/null || echo "таблицы нет"
            docker exec cmpas-postgres psql -U postgres -d cmpas_db -tAc \
              "SELECT 'незавершённых=' || count(*) FROM _prisma_migrations WHERE finished_at IS NULL AND rolled_back_at IS NULL" 2>/dev/null || true
            echo "### Последние 15 применённых"
            docker exec cmpas-postgres psql -U postgres -d cmpas_db -tAc \
              "SELECT migration_name || ' | finished=' || coalesce(finished_at::text,'НЕТ') FROM _prisma_migrations ORDER BY started_at DESC LIMIT 15" 2>/dev/null || true
            echo "### Ключевые колонки, которых может не хватать"
            docker exec cmpas-postgres psql -U postgres -d cmpas_db -tAc \
              "SELECT table_name || '.' || column_name FROM information_schema.columns
               WHERE table_schema='public' AND (
                 (table_name='User' AND column_name='analyticsConsentAt') OR
                 (table_name='Payment' AND column_name='terminal') OR
                 (table_name='PsychologistSettings' AND column_name IN ('timeSuggestEnabled','privateRemindersEnabled'))
               );"
            echo "### Есть ли новые таблицы"
            docker exec cmpas-postgres psql -U postgres -d cmpas_db -tAc \
              "SELECT table_name FROM information_schema.tables WHERE table_schema='public'
               AND table_name IN ('Subscription','events','events_rejected','WaitlistEntry');"

      - name: Записать отчёт в репозиторий
        if: always()
        run: |
          mkdir -p docs/ops
          {
            echo "# Состояние миграций на боевой базе"
            echo
            echo "Снято прогоном ${{ github.run_id }}. Файл перезаписывается каждой диагностикой."
            echo
            echo '```'
            cat <<'REPORT'
          ${{ steps.doctor.outputs.stdout }}
          REPORT
            echo '```'
            echo
            echo "## Миграции, лежащие в репозитории"
            echo
            echo '```'
            ls -1 prisma/migrations | grep -v migration_lock || true
            echo '```'
          } > docs/ops/db-doctor.md

      - name: Закоммитить отчёт
        if: always()
        run: |
          git config user.name 'simpas-doctor'
          git config user.email 'bot@users.noreply.github.com'
          git add docs/ops/db-doctor.md
          git diff --cached --quiet || git commit -m "Диагностика базы: состояние журнала миграций"
          git push origin HEAD:main || echo "нечего пушить"
