name: Channel Binding CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'android/**'
      - 'prisma/**'
      - '.npmrc'
      - '.github/workflows/channel-binding-ci.yml'
  workflow_dispatch:

jobs:
  web:
    name: Web module checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - name: Collect TypeScript diagnostics
        continue-on-error: true
        run: npx tsc --noEmit --pretty false > tsc.log
      - name: Assert no channel binding TypeScript errors
        run: |
          if grep -E '^(src/lib/(channel-binding|telegram-login|telegram)\.ts|src/app/(connect/|api/channel-binding/|api/(telegram|MAX|max)/|api/mobile/clients/|diary/actions/client-onboarding\.ts))' tsc.log; then
            cat tsc.log
            exit 1
          fi
      - name: Lint new channel binding files
        run: npx eslint src/lib/channel-binding.ts src/lib/telegram-login.ts src/app/api/channel-binding/telegram-login/route.ts src/app/api/max/webhook/route.ts src/app/api/mobile/clients/[id]/invite/route.ts src/app/api/mobile/clients/[id]/channels/route.ts src/app/connect/[token]/ConnectClient.tsx src/app/connect/[token]/page.tsx src/app/connect/success/page.tsx src/app/diary/actions/client-onboarding.ts

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build Android
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace > android-build.log 2>&1
      - name: Save Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/android-build.log
