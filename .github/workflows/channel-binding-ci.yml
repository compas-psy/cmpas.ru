name: Channel Binding CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'android/**'
      - 'prisma/**'
      - '.npmrc'
      - '.github/workflows/channel-binding-ci.yml'
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit --pretty false > tsc.log
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsc-diagnostics
          path: tsc.log
      - run: npm run lint
