name: Task 28 · Android на устройстве

# Главное недостающее доказательство Задачи 27: Android, отрисованный
# по-настоящему, а не сверенный по исходнику.
#
# Здесь на одной машине поднимается ВЕСЬ стенд: PostgreSQL, миграции,
# синтетический посев, собранное приложение Next.js — и рядом эмулятор
# Android, которому этот стенд виден как http://10.0.2.2:3100. Боевого
# сервера прогон не касается вовсе: адрес передаётся сборке свойством
# `-PapiBaseUrl`, по умолчанию оставшимся боевым.
#
# Данные только синтетические (scripts/e2e-seed.cjs). Ни одного настоящего
# клиента, ни одной отправки в мессенджер: токенов ботов job не получает.

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/praktika-mvp-launch'
    paths:
      - '.github/workflows/task28-android-device.yml'
      - 'scripts/task28-android-smoke.sh'
      - 'scripts/task28-accept-legal.cjs'
      - 'scripts/task28-log-privacy.sh'
      - 'android/**'

# Снимки нужно посмотреть глазами, а хранилище артефактов GitHub из рабочей
# среды агента не читается — тот же упор, ради которого db-doctor.yml кладёт
# свой отчёт обратно в репозиторий. Поэтому и здесь доказательства
# возвращаются в ветку выпуска.
permissions:
  contents: write

concurrency:
  group: task28-android-device
  cancel-in-progress: true

jobs:
  device:
    name: Эмулятор, снимки и функциональный обход
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task28_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/task28_db
      AUTH_SECRET: task28-staging-secret-not-a-real-one
      AUTH_TRUST_HOST: 'true'
      AUTH_URL: http://localhost:3100
      NEXTAUTH_URL: http://localhost:3100
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Аппаратное ускорение доступно?
        run: |
          echo "kvm:"; ls -la /dev/kvm 2>&1 || echo "/dev/kvm отсутствует"
          egrep -c '(vmx|svm)' /proc/cpuinfo || true

      # Без этого эмулятор поднимается программной отрисовкой и не
      # укладывается в отведённое время.
      - name: Разрешить KVM текущему пользователю
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Поднять стенд
        run: |
          set -e
          npm ci --legacy-peer-deps
          npx prisma generate
          npx prisma migrate deploy
          node scripts/e2e-seed.cjs
          npm run build

      - name: Запустить приложение
        run: |
          nohup npx next start -p 3100 > /tmp/stand.log 2>&1 &
          for i in $(seq 1 30); do
            sleep 2
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/ || true)
            [ "$code" = "200" ] && { echo "стенд поднялся"; break; }
          done
          curl -sS -o /dev/null -w 'GET /  -> %{http_code}\n' http://localhost:3100/

      - name: Принять обязательные документы за синтетических специалистов
        run: node scripts/task28-accept-legal.cjs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Собрать отладочную сборку против стенда
        working-directory: android
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle assembleDebug --no-daemon \
            -PapiBaseUrl=http://10.0.2.2:3100/api/mobile/
          ls -la app/build/outputs/apk/debug/

      # Кадр 390×844 из хендоффа: Pixel 5 — 1080×2340 при 440dpi, то есть
      # 393×851dp. Ближе штатного профиля к эталону нет.
      - name: Эмулятор, эталонный кадр (Pixel 5, ~393×851dp)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/task28-android-smoke.sh reference

      - name: Эмулятор, узкий кадр (~360×640dp)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/task28-android-smoke.sh narrow

      - name: Сводки обоих кадров
        if: always()
        run: |
          echo '===== СВОДКИ ====='
          for f in artifacts-out/android/*/SUMMARY.txt; do
            [ -f "$f" ] && { echo; cat "$f"; }
          done
          echo '===== КОНЕЦ СВОДОК ====='

      - name: Журнал стенда — ищем в нём личное
        if: always()
        run: |
          echo "строк в журнале: $(wc -l < /tmp/stand.log 2>/dev/null || echo 0)"
          bash scripts/task28-log-privacy.sh /tmp/stand.log || true

      - name: Положить снимки в репозиторий
        if: always()
        run: |
          set -e
          TARGET=artifacts/praktika-mvp/task28/android
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp -r artifacts-out/android/* "$TARGET"/ 2>/dev/null || true
          # logcat в репозиторий не кладём: он большой и полон чужого шума.
          find "$TARGET" -name 'logcat.txt' -delete 2>/dev/null || true
          echo "файлов: $(find "$TARGET" -type f | wc -l), объём: $(du -sh "$TARGET" 2>/dev/null | cut -f1)"

          git config user.name 'compas-psy'
          git config user.email 'noreply@cmpas.ru'
          git add -A "$TARGET"
          if git diff --cached --quiet; then
            echo "изменений нет"
          else
            git commit \
              -m "evidence: android device screenshots for task 28" \
              -m "Снимки сняты на эмуляторе прогоном ${{ github.run_id }}: кадр Pixel 5 (~393x851dp) и узкий кадр. Кладутся в репозиторий, потому что хранилище артефактов GitHub из рабочей среды агента не читается." \
              -m "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Выложить снимки и журналы
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task28-android-device
          path: artifacts-out/**
          if-no-files-found: warn
          retention-days: 14

      - name: Вердикт по обоим кадрам
        if: always()
        run: |
          [ -d artifacts-out/android ] || { echo 'снимков нет вовсе'; exit 1; }
          fail=0
          for f in artifacts-out/android/*/SUMMARY.txt; do
            [ -f "$f" ] || continue
            grep -q 'ИТОГ: PASS' "$f" || fail=1
          done
          exit $fail
