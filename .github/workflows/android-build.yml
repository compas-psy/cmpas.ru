name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/app/api/mobile/**'
      - 'src/lib/mobile-auth.ts'
      - 'src/lib/legal-documents.ts'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/app/api/mobile/**'
      - 'src/lib/mobile-auth.ts'
      - 'src/lib/legal-documents.ts'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version

      # Note: the APK is signed with the committed keystore at
      # android/keystore/compas-release.jks (see app/build.gradle.kts).
      # This keeps the signature stable across builds so installs update
      # in place instead of requiring an uninstall.

      # Тесты гоняются ДО сборки: провалившийся тест обязан останавливать
      # выкладку APK, а не приезжать вместе с ним. До этого шага в этом
      # workflow не запускался ни один тест, при том что тесты в репозитории
      # лежали.
      - name: Run unit tests
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          # Без --stacktrace: на упавшем тесте Gradle печатает полсотни строк
          # собственного стека исполнителя, в которых тонет единственное, что
          # нужно — какой тест упал и почему.
          /tmp/gradle-8.9/bin/gradle testDebugUnitTest --no-daemon 2>&1 | tee ../android-test.log

      # Компактный итог прямо в журнал прогона. Отчёт выгружается артефактом,
      # но артефакты GitHub лежат в blob-хранилище, к которому из части сред
      # нет доступа (CONNECT tunnel failed, 403) — и тогда «тесты упали»
      # приходит без единого слова о том, какие именно.
      - name: Итог тестов
        if: always()
        working-directory: android
        shell: bash
        run: |
          results=app/build/test-results/testDebugUnitTest
          [ -d "$results" ] || { echo "Результатов нет — тесты не запускались."; exit 0; }
          echo "===== ИТОГ ТЕСТОВ ====="
          for f in "$results"/*.xml; do
            [ -e "$f" ] || continue
            sed -n 's/.*<testsuite name="\([^"]*\)".*tests="\([0-9]*\)".*failures="\([0-9]*\)".*errors="\([0-9]*\)".*/\1: тестов \2, провалов \3, ошибок \4/p' "$f"
          done
          echo "===== ЧТО ИМЕННО УПАЛО ====="
          found=0
          for f in "$results"/*.xml; do
            [ -e "$f" ] || continue
            grep -q "<failure\|<error" "$f" || continue
            found=1
            python3 - "$f" <<'PYEOF'
          import re, sys, html
          text = open(sys.argv[1], encoding='utf-8').read()
          for case in re.findall(r'<testcase\b[^>]*>.*?</testcase>|<testcase\b[^>]*/>', text, re.S):
              name = re.search(r'name="([^"]*)"', case)
              fail = re.search(r'<(?:failure|error)[^>]*message="([^"]*)"', case)
              if name and fail:
                  print(f"  ✗ {html.unescape(name.group(1))}")
                  print(f"      {html.unescape(fail.group(1))[:400]}")
          PYEOF
          done
          [ "$found" = 1 ] || echo "  (провалов нет)"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: |
            android-test.log
            android/app/build/reports/tests/
            android/app/build/test-results/
          retention-days: 14

      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          /tmp/gradle-8.9/bin/gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../android-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          retention-days: 14

      - name: Prepare APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          VERSION=$(grep 'versionName' android/app/build.gradle.kts | head -1 | grep -oP '"[^"]*"' | tr -d '"')
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          FILENAME="compas-${VERSION}-${SHA}.apk"
          cp "$APK_PATH" "$FILENAME"
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: compas-android-apk
          path: compas-*.apk
          retention-days: 90

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.apk.outputs.version }}-b${{ github.run_number }}
          name: "КОМПАС Android ${{ steps.apk.outputs.version }} (#${{ github.run_number }})"
          body: |
            ## КОМПАС для Android
            Скачайте APK ниже и установите на телефон.
          files: compas-*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
