name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/app/api/mobile/**'
      - 'src/lib/mobile-auth.ts'
      - 'src/lib/legal-documents.ts'
      # Стыковочный тест конверта гоняет НАСТОЯЩИЙ приёмник — значит правка
      # приёмника обязана его запускать. Без этих трёх строк PR, меняющий
      # только валидатор, реестр или проверку секретов, не запускал ни одного
      # теста ни в одном workflow.
      - 'src/lib/analytics/**'
      - 'analytics/schema/**'
      - 'src/app/api/ingest/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/app/api/mobile/**'
      - 'src/lib/mobile-auth.ts'
      - 'src/lib/legal-documents.ts'
      # Стыковочный тест конверта гоняет НАСТОЯЩИЙ приёмник — значит правка
      # приёмника обязана его запускать. Без этих трёх строк PR, меняющий
      # только валидатор, реестр или проверку секретов, не запускал ни одного
      # теста ни в одном workflow.
      - 'src/lib/analytics/**'
      - 'analytics/schema/**'
      - 'src/app/api/ingest/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version

      # Note: the APK is signed with the committed keystore at
      # android/keystore/compas-release.jks (see app/build.gradle.kts).
      # This keeps the signature stable across builds so installs update
      # in place instead of requiring an uninstall.

      # Тесты гоняются ДО сборки: провалившийся тест обязан останавливать
      # выкладку APK, а не приезжать вместе с ним. До этого шага в этом
      # workflow не запускался ни один тест, при том что тесты в репозитории
      # лежали.
      - name: Run unit tests
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          # Без --stacktrace: на упавшем тесте Gradle печатает полсотни строк
          # собственного стека исполнителя, в которых тонет единственное, что
          # нужно — какой тест упал и почему.
          /tmp/gradle-8.9/bin/gradle testDebugUnitTest --no-daemon 2>&1 | tee ../android-test.log

      # Компактный итог прямо в журнал прогона. Отчёт выгружается артефактом,
      # но артефакты GitHub лежат в blob-хранилище, к которому из части сред
      # нет доступа (CONNECT tunnel failed, 403) — и тогда «тесты упали»
      # приходит без единого слова о том, какие именно.
      #
      # Разбор идёт grep/sed, без вложенного heredoc: heredoc внутри блока
      # run: в YAML требует терминатора в нулевой колонке, а блок неизбежно
      # с отступом — такой шаг молча не делает ничего.
      - name: Итог тестов
        if: always()
        working-directory: android
        shell: bash
        run: |
          results=app/build/test-results/testDebugUnitTest
          if [ ! -d "$results" ]; then
            echo "Результатов нет — тесты не запускались."
            exit 0
          fi
          echo "===== ИТОГ ТЕСТОВ ====="
          grep -h -o 'tests="[0-9]*"[^>]*failures="[0-9]*"[^>]*errors="[0-9]*"' "$results"/*.xml || true
          echo "===== ЧТО ИМЕННО УПАЛО ====="
          if grep -l '<failure\|<error' "$results"/*.xml >/dev/null 2>&1; then
            for f in $(grep -l '<failure\|<error' "$results"/*.xml); do
              echo "--- $(basename "$f")"
              tr '<' '\n' < "$f" \
                | sed -n -e 's/^testcase name="\([^"]*\)".*/  ТЕСТ: \1/p' \
                         -e 's/^failure message="\([^"]*\)".*/      ПРИЧИНА: \1/p' \
                         -e 's/^error message="\([^"]*\)".*/      ОШИБКА: \1/p'
            done
          else
            echo "  (провалов нет)"
          fi

      # Стык приложения и приёмника — настоящим конвертом, а не пересказом.
      #
      # Зачем именно так. В репозитории уже был tests/cross-repo-contract.ts, и
      # он сам про себя честно писал, что фикстура МОМЕНТОВ «ВЫВЕДЕНА ЧТЕНИЕМ»
      # кода Kotlin, потому что Gradle в той среде не поднимался. Такая фикстура
      # проверяет представление автора о своём же коде, а не сам код. Здесь
      # Gradle есть: конверт собирает НАСТОЯЩИЙ билдер приложения, тест
      # выкладывает его файлом, а дальше он проходит через НАСТОЯЩИЙ маршрут и
      # НАСТОЯЩИЙ валидатор приёмника из этого же репозитория.
      #
      # Отсутствие файла — провал, а не пропуск: молча пройденная проверка
      # выглядит как зелёная ровно так же, как выполненная.
      - name: Проверить конверт аналитики против приёмника
        if: success()
        shell: bash
        run: |
          fixture=android/app/build/analytics-fixture/practice-android-envelopes.json
          if [ ! -s "$fixture" ]; then
            echo "Конверт не выложен приложением ($fixture отсутствует или пуст)."
            echo "Тест приложения обязан его записать — иначе стык не проверяется вовсе."
            exit 1
          fi
          mkdir -p tests/fixtures/android
          cp "$fixture" tests/fixtures/android/practice-android-envelopes.json
          echo "Конверт от приложения:"
          cat tests/fixtures/android/practice-android-envelopes.json

      - name: Set up Node
        if: success()
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Прогнать конверт через приёмник
        if: success()
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npx vitest run --config vitest.contract.mts

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: |
            android-test.log
            android/app/build/reports/tests/
            android/app/build/test-results/
          retention-days: 14

      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          /tmp/gradle-8.9/bin/gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../android-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          retention-days: 14

      - name: Prepare APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          VERSION=$(grep 'versionName' android/app/build.gradle.kts | head -1 | grep -oP '"[^"]*"' | tr -d '"')
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          FILENAME="compas-${VERSION}-${SHA}.apk"
          cp "$APK_PATH" "$FILENAME"
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: compas-android-apk
          path: compas-*.apk
          retention-days: 90

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.apk.outputs.version }}-b${{ github.run_number }}
          name: "КОМПАС Android ${{ steps.apk.outputs.version }} (#${{ github.run_number }})"
          body: |
            ## КОМПАС для Android
            Скачайте APK ниже и установите на телефон.
          files: compas-*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
