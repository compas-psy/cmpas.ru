name: Deploy with Docker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            cd /var/www/cmpas.ru
            
            # Update .env.local
            cat <<EOF > .env.local
            DATABASE_URL=${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@postgres:5432/cmpas_db' }}
            YANDEX_CLIENT_ID=${{ secrets.YANDEX_CLIENT_ID || '1b261cbc153045beb7d707389fc27515' }}
            YANDEX_CLIENT_SECRET=${{ secrets.YANDEX_CLIENT_SECRET || 'b3b7316b0f72442485f441c63ba59cba' }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET || 'changeme-in-production-please-secret-key' }}
            EMAIL_SERVER_HOST=mailer
            EMAIL_SERVER_PORT=25
            EMAIL_FROM=noreply@cmpas.ru
            AUTH_TRUST_HOST=true
            AUTH_URL=https://cmpas.ru
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
            EOF
            
            # Stop old PM2 if running
            pm2 stop cmpas-app 2>/dev/null || true
            pm2 delete cmpas-app 2>/dev/null || true
            
            # UPDATE CODE
            git stash 2>/dev/null || true
            git pull origin main
            
            # Ensure port 25 is free
            fuser -k 25/tcp 2>/dev/null || true
            
            # Rebuild and restart containers (Docker cache should speed this up)
            docker compose up -d --build
            
            # Run Database Migrations
            sleep 5
            docker compose exec -T app node node_modules/prisma/build/index.js migrate deploy 2>/dev/null || true
            
            # Cleanup old images
            docker image prune -f

