name: Deploy with Docker

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android-build.yml'
      - 'docs/**'
      - '.agent/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 45m
          script: |
            set -e
            cd /var/www/cmpas.ru

            git stash 2>/dev/null || true
            git pull origin main

            touch .env

            upsert_env() {
              KEY="$1"
              VALUE="$2"
              ESCAPED_VALUE=$(printf '%s' "$VALUE" | sed 's/[&|]/\\&/g')
              if grep -q "^${KEY}=" .env; then
                sed -i "s|^${KEY}=.*|${KEY}=${ESCAPED_VALUE}|" .env
              else
                printf '%s=%s\n' "$KEY" "$VALUE" >> .env
              fi
            }

            ensure_env() {
              KEY="$1"
              DEFAULT_VALUE="$2"
              CURRENT_VALUE=$(grep "^${KEY}=" .env | cut -d= -f2- || true)
              if [ -z "$CURRENT_VALUE" ]; then
                upsert_env "$KEY" "$DEFAULT_VALUE"
              fi
            }

            ensure_env DATABASE_URL 'postgresql://postgres:postgres@postgres:5432/cmpas_db'
            ensure_env EMAIL_SERVER_HOST 'mailer'
            ensure_env EMAIL_SERVER_PORT '25'
            ensure_env EMAIL_FROM 'noreply@cmpas.ru'
            ensure_env AUTH_TRUST_HOST 'true'
            ensure_env AUTH_URL 'https://cmpas.ru'
            ensure_env TELEGRAM_API_URL 'https://api.telegram.org'
            ensure_env TELEGRAM_PROXY ''
            ensure_env MAX_BOT_USERNAME ''

            CURRENT_SECRET=$(grep '^AUTH_SECRET=' .env | cut -d= -f2- || true)
            if [ -z "$CURRENT_SECRET" ] || echo "$CURRENT_SECRET" | grep -qi 'changeme\|placeholder\|secret-to-be-changed'; then
              upsert_env AUTH_SECRET "$(openssl rand -base64 32)"
              echo 'AUTH_SECRET generated or replaced.'
            fi

            YANDEX_CLIENT_ID='${{ secrets.YANDEX_CLIENT_ID }}'
            YANDEX_CLIENT_SECRET='${{ secrets.YANDEX_CLIENT_SECRET }}'
            TELEGRAM_BOT_TOKEN='${{ secrets.TELEGRAM_BOT_TOKEN }}'
            TELEGRAM_CHAT_ID='${{ secrets.TELEGRAM_CHAT_ID }}'
            MAX_BOT_TOKEN='${{ secrets.MAX_BOT_TOKEN }}'
            MAX_BOT_USERNAME='${{ secrets.MAX_BOT_USERNAME }}'
            DADATA_API_KEY='${{ secrets.DADATA_API_KEY }}'

            [ -n "$YANDEX_CLIENT_ID" ] && upsert_env YANDEX_CLIENT_ID "$YANDEX_CLIENT_ID"
            [ -n "$YANDEX_CLIENT_SECRET" ] && upsert_env YANDEX_CLIENT_SECRET "$YANDEX_CLIENT_SECRET"
            [ -n "$TELEGRAM_BOT_TOKEN" ] && upsert_env TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
            [ -n "$TELEGRAM_CHAT_ID" ] && upsert_env TELEGRAM_CHAT_ID "$TELEGRAM_CHAT_ID"
            [ -n "$MAX_BOT_TOKEN" ] && upsert_env MAX_BOT_TOKEN "$MAX_BOT_TOKEN"
            [ -n "$MAX_BOT_USERNAME" ] && upsert_env MAX_BOT_USERNAME "$MAX_BOT_USERNAME"
            [ -n "$DADATA_API_KEY" ] && upsert_env DADATA_API_KEY "$DADATA_API_KEY"

            TELEGRAM_WEBHOOK_SECRET=$(grep '^TELEGRAM_WEBHOOK_SECRET=' .env | cut -d= -f2- || true)
            if [ -z "$TELEGRAM_WEBHOOK_SECRET" ]; then
              upsert_env TELEGRAM_WEBHOOK_SECRET "$(openssl rand -hex 32)"
            fi

            echo "AUTH_SECRET fingerprint: $(grep '^AUTH_SECRET=' .env | cut -d= -f2- | cut -c1-8)..."

            MIERU_SERVER='${{ secrets.MIERU_SERVER }}'
            MIERU_PORT='${{ secrets.MIERU_PORT }}'
            MIERU_USERNAME='${{ secrets.MIERU_USERNAME }}'
            MIERU_PASSWORD='${{ secrets.MIERU_PASSWORD }}'
            VPN_ENABLED=0

            if [ -n "$MIERU_SERVER" ] && [ -n "$MIERU_PORT" ] && [ -n "$MIERU_USERNAME" ] && [ -n "$MIERU_PASSWORD" ]; then
              echo 'Mieru credentials present — materializing sing-box config...'
              sed \
                -e "s|\${MIERU_SERVER}|${MIERU_SERVER}|g" \
                -e "s|\${MIERU_PORT}|${MIERU_PORT}|g" \
                -e "s|\${MIERU_USERNAME}|${MIERU_USERNAME}|g" \
                -e "s|\${MIERU_PASSWORD}|${MIERU_PASSWORD}|g" \
                deploy/singbox-config.template.json > deploy/singbox-config.json
              python3 -c "import json; json.load(open('deploy/singbox-config.json')); print('sing-box config: valid JSON')"
              docker run --rm -v "$(pwd)/deploy/singbox-config.json:/c.json:ro" ghcr.io/sagernet/sing-box:latest check -c /c.json
              upsert_env TELEGRAM_PROXY 'http://singbox:1080'
              export COMPOSE_PROFILES=vpn
              VPN_ENABLED=1
            else
              echo 'Mieru credentials not set — Telegram uses direct connection.'
              upsert_env TELEGRAM_PROXY ''
            fi

            BACKUP_DIR='/var/backups/cmpas'
            mkdir -p "$BACKUP_DIR"
            if docker ps --format '{{.Names}}' | grep -qx 'cmpas-postgres'; then
              BACKUP_FILE="$BACKUP_DIR/db_backup_$(date +%Y%m%d_%H%M%S).sql"
              echo "Creating database backup: $BACKUP_FILE"
              docker exec cmpas-postgres pg_dump -U postgres -d cmpas_db > "$BACKUP_FILE"
              ls -t "$BACKUP_DIR"/db_backup_*.sql 2>/dev/null | tail -n +11 | xargs -r rm -f

              echo 'Applying schema safety nets before replacing containers...'
              docker cp deploy/schema-fixes.sql cmpas-postgres:/tmp/schema-fixes.sql
              docker exec cmpas-postgres psql -v ON_ERROR_STOP=1 -U postgres -d cmpas_db -f /tmp/schema-fixes.sql
              docker cp deploy/beta-mvp-schema-fixes.sql cmpas-postgres:/tmp/beta-mvp-schema-fixes.sql
              docker exec cmpas-postgres psql -v ON_ERROR_STOP=1 -U postgres -d cmpas_db -f /tmp/beta-mvp-schema-fixes.sql
            else
              echo 'Running postgres not found — backup and pre-start repair skipped.'
            fi

            echo 'Pre-building Docker images...'
            docker compose build

            docker compose down --timeout 30 || true
            docker image prune -f || true

            systemctl stop exim4 postfix sendmail 2>/dev/null || true
            systemctl disable exim4 postfix sendmail 2>/dev/null || true
            fuser -k 25/tcp 2>/dev/null || true
            sleep 2

            if [ "$VPN_ENABLED" = '1' ]; then
              docker compose --profile vpn up -d postgres mailer singbox
            else
              docker compose up -d postgres mailer
            fi

            echo 'Waiting for postgres...'
            RETRIES=30
            until docker exec cmpas-postgres pg_isready -U postgres -d cmpas_db >/dev/null 2>&1 || [ "$RETRIES" -eq 0 ]; do
              RETRIES=$((RETRIES-1))
              sleep 2
            done
            if [ "$RETRIES" -eq 0 ]; then
              echo 'ERROR: Postgres failed to start.'
              docker logs cmpas-postgres --tail 200 2>&1 || true
              exit 1
            fi

            echo 'Patching pg_hba.conf for Docker-network trust auth...'
            docker exec -u postgres cmpas-postgres sh -c "sed -i 's/host all all all scram-sha-256/host all all all trust/' /var/lib/postgresql/data/pg_hba.conf"
            docker exec -u postgres cmpas-postgres sh -c "sed -i 's/host all all all md5/host all all all trust/' /var/lib/postgresql/data/pg_hba.conf"
            docker exec -u postgres cmpas-postgres pg_ctl reload -D /var/lib/postgresql/data

            echo 'Starting application after database readiness...'
            docker compose up -d --force-recreate app

            echo 'Waiting for application health...'
            APP_HEALTHY=0
            for i in $(seq 1 45); do
              if docker compose exec -T app node -e "fetch('http://127.0.0.1:3000/api/auth/session').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"; then
                APP_HEALTHY=1
                echo 'Application is healthy.'
                break
              fi
              sleep 2
            done

            if [ "$APP_HEALTHY" != '1' ]; then
              echo 'ERROR: Application did not become healthy.'
              docker ps -a --filter name=cmpas-app --format '{{.Names}} | {{.Status}}'
              docker logs cmpas-app --tail 300 2>&1 || true
              exit 1
            fi

            echo 'Running strict runtime schema verification...'
            docker compose exec -T app node scripts/verify-production-schema.js

            echo 'Checking Prisma migration history...'
            if docker compose exec -T app node node_modules/prisma/build/index.js migrate status; then
              echo 'Prisma migration history: clean.'
            else
              echo 'WARNING: Runtime schema is valid, but Prisma migration history requires maintenance.'
            fi

            echo 'Testing database connectivity from app...'
            docker compose exec -T app node -e "const {PrismaClient}=require('@prisma/client'); const p=new PrismaClient(); p.\$queryRaw\`SELECT 1\`.then(()=>p.\$disconnect()).then(()=>process.exit(0)).catch(e=>{console.error(e);process.exit(1)})"

            AUTH_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/auth/session)
            echo "Auth endpoint status: $AUTH_STATUS"
            if [ "$AUTH_STATUS" -ge 500 ] || [ "$AUTH_STATUS" = '000' ]; then
              echo 'ERROR: Auth endpoint is unhealthy.'
              exit 1
            fi

            TG_TOKEN=$(grep '^TELEGRAM_BOT_TOKEN=' .env | cut -d= -f2- || true)
            TG_API_URL=$(grep '^TELEGRAM_API_URL=' .env | cut -d= -f2- || true)
            TG_API_URL=${TG_API_URL:-https://api.telegram.org}
            TG_WH_SECRET=$(grep '^TELEGRAM_WEBHOOK_SECRET=' .env | cut -d= -f2- || true)
            if [ -n "$TG_TOKEN" ]; then
              echo 'Registering Telegram webhook...'
              curl -fsS -X POST "${TG_API_URL}/bot${TG_TOKEN}/setWebhook" \
                -H 'Content-Type: application/json' \
                -d "{\"url\":\"https://cmpas.ru/api/telegram/webhook\",\"drop_pending_updates\":false,\"secret_token\":\"${TG_WH_SECRET}\"}" || echo 'WARNING: Telegram webhook registration failed.'
            fi

            MAX_TOKEN=$(grep '^MAX_BOT_TOKEN=' .env | cut -d= -f2- || true)
            if [ -n "$MAX_TOKEN" ]; then
              echo 'Registering MAX webhook...'
              curl -sS -X DELETE 'https://botapi.max.ru/subscriptions' -H "Authorization: ${MAX_TOKEN}" || true
              curl -fsS -X POST 'https://botapi.max.ru/subscriptions' \
                -H "Authorization: ${MAX_TOKEN}" \
                -H 'Content-Type: application/json' \
                -d '{"url":"https://cmpas.ru/api/max/webhook","update_types":["bot_started","message_created","message_callback"]}' || echo 'WARNING: MAX webhook registration failed.'
            fi

            if [ "$VPN_ENABLED" = '1' ]; then
              echo '=== sing-box diagnostics ==='
              docker ps -a --filter name=cmpas-singbox --format '{{.Names}} | {{.Status}} | {{.State}}' || true
              docker logs cmpas-singbox --tail 80 2>&1 || true
            fi

            docker image prune -f
            echo 'Deployment complete.'
