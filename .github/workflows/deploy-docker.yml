name: Deploy with Docker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            cd /var/www/cmpas.ru
            
            # Stop execution on any error
            set -e

            # UPDATE CODE
            git stash 2>/dev/null || true
            git pull origin main
            
            # ============================================
            # .env FILE MANAGEMENT (CRITICAL!)
            # NEVER overwrite .env if it already exists.
            # AUTH_SECRET MUST stay the same across deploys,
            # otherwise all user sessions are invalidated.
            # ============================================
            if [ ! -f .env ]; then
              echo "No .env found — creating with fresh AUTH_SECRET..."
              GENERATED_AUTH_SECRET=$(openssl rand -base64 32)
              cat <<EOF > .env
            DATABASE_URL=postgresql://postgres:postgres@postgres:5432/cmpas_db
            YANDEX_CLIENT_ID=${{ secrets.YANDEX_CLIENT_ID || '1b261cbc153045beb7d707389fc27515' }}
            YANDEX_CLIENT_SECRET=${{ secrets.YANDEX_CLIENT_SECRET || 'b3b7316b0f72442485f441c63ba59cba' }}
            AUTH_SECRET=${GENERATED_AUTH_SECRET}
            EMAIL_SERVER_HOST=mailer
            EMAIL_SERVER_PORT=25
            EMAIL_FROM=noreply@cmpas.ru
            AUTH_TRUST_HOST=true
            AUTH_URL=https://cmpas.ru
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN || '7728157706:AAEZMpN66PSXd7GkyIhKK4Fz4vTi5lxJYI8' }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID || '182398258' }}
            MAX_BOT_TOKEN=f9LHodD0cOKrt8cFAnV2oYzsTPF3ekmaQmWooGBgMSh8R0uxwmRKOeFjDZrOnKvAg3dsNwSpISfo4c92XRM9
            GOOGLE_CALENDAR_CLIENT_ID=649610920409-i5orvlp14u9qo882fqd6caji868o603c.apps.googleusercontent.com
            GOOGLE_CALENDAR_CLIENT_SECRET=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
            DADATA_API_KEY=${{ secrets.DADATA_API_KEY || 'a976d243bf1e28529e4d7d1d4adc87a155ca9d57' }}
            EOF
              echo ".env created with new AUTH_SECRET."
            else
              echo ".env already exists — preserving AUTH_SECRET."
              
              # Validate that AUTH_SECRET is present and not a placeholder
              CURRENT_SECRET=$(grep "^AUTH_SECRET=" .env | cut -d= -f2)
              if [ -z "$CURRENT_SECRET" ]; then
                echo "WARNING: AUTH_SECRET missing from .env! Adding one..."
                GENERATED_AUTH_SECRET=$(openssl rand -base64 32)
                echo "AUTH_SECRET=${GENERATED_AUTH_SECRET}" >> .env
              elif echo "$CURRENT_SECRET" | grep -qi "changeme\|placeholder\|secret-to-be-changed"; then
                echo "WARNING: AUTH_SECRET is a placeholder! Replacing with a real secret..."
                GENERATED_AUTH_SECRET=$(openssl rand -base64 32)
                sed -i "s|^AUTH_SECRET=.*|AUTH_SECRET=${GENERATED_AUTH_SECRET}|" .env
                echo "AUTH_SECRET replaced. NOTE: Existing sessions will be invalidated (one-time fix)."
              fi
              
              # Fix empty credentials (from previous broken deploys)
              if [ -z "$(grep '^YANDEX_CLIENT_ID=' .env | cut -d= -f2)" ]; then
                echo "WARNING: YANDEX_CLIENT_ID is empty! Setting fallback..."
                sed -i "s|^YANDEX_CLIENT_ID=.*|YANDEX_CLIENT_ID=${{ secrets.YANDEX_CLIENT_ID || '1b261cbc153045beb7d707389fc27515' }}|" .env
              fi
              if [ -z "$(grep '^YANDEX_CLIENT_SECRET=' .env | cut -d= -f2)" ]; then
                echo "WARNING: YANDEX_CLIENT_SECRET is empty! Setting fallback..."
                sed -i "s|^YANDEX_CLIENT_SECRET=.*|YANDEX_CLIENT_SECRET=${{ secrets.YANDEX_CLIENT_SECRET || 'b3b7316b0f72442485f441c63ba59cba' }}|" .env
              fi
              if [ -z "$(grep '^TELEGRAM_BOT_TOKEN=' .env | cut -d= -f2)" ]; then
                sed -i "s|^TELEGRAM_BOT_TOKEN=.*|TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN || '7728157706:AAEZMpN66PSXd7GkyIhKK4Fz4vTi5lxJYI8' }}|" .env
              fi
              if [ -z "$(grep '^TELEGRAM_CHAT_ID=' .env | cut -d= -f2)" ]; then
                sed -i "s|^TELEGRAM_CHAT_ID=.*|TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID || '182398258' }}|" .env
              fi
              # Ensure MAX_BOT_TOKEN is set
              if ! grep -q '^MAX_BOT_TOKEN=' .env; then
                echo "MAX_BOT_TOKEN=f9LHodD0cOKrt8cFAnV2oYzsTPF3ekmaQmWooGBgMSh8R0uxwmRKOeFjDZrOnKvAg3dsNwSpISfo4c92XRM9" >> .env
              fi

              # Update non-secret env vars that may have changed
              # (these don't affect sessions, safe to update)
              sed -i 's|^DATABASE_URL=.*|DATABASE_URL=postgresql://postgres:postgres@postgres:5432/cmpas_db|' .env
              sed -i 's|^EMAIL_SERVER_HOST=.*|EMAIL_SERVER_HOST=mailer|' .env
              sed -i 's|^EMAIL_SERVER_PORT=.*|EMAIL_SERVER_PORT=25|' .env
              sed -i 's|^EMAIL_FROM=.*|EMAIL_FROM=noreply@cmpas.ru|' .env
              sed -i 's|^AUTH_TRUST_HOST=.*|AUTH_TRUST_HOST=true|' .env
              sed -i 's|^AUTH_URL=.*|AUTH_URL=https://cmpas.ru|' .env
              
              # Ensure DADATA_API_KEY exists
              if ! grep -q '^DADATA_API_KEY=' .env; then
                echo "DADATA_API_KEY=${{ secrets.DADATA_API_KEY || 'a976d243bf1e28529e4d7d1d4adc87a155ca9d57' }}" >> .env
              fi
            fi
            
            # Show AUTH_SECRET fingerprint (first 8 chars) for debugging
            echo "AUTH_SECRET fingerprint: $(grep '^AUTH_SECRET=' .env | cut -d= -f2 | cut -c1-8)..."

            # ============================================
            # DATABASE BACKUP (CRITICAL - DO NOT SKIP!)
            # ============================================
            BACKUP_DIR="/var/backups/cmpas"
            mkdir -p "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/db_backup_$(date +%Y%m%d_%H%M%S).sql"
            
            echo "Creating database backup: $BACKUP_FILE"
            docker exec cmpas-postgres pg_dump -U postgres -d cmpas_db > "$BACKUP_FILE" 2>/dev/null || echo "Warning: Could not create backup (database may be new)"
            
            # Keep only last 10 backups
            ls -t "$BACKUP_DIR"/db_backup_*.sql 2>/dev/null | tail -n +11 | xargs rm -f 2>/dev/null || true
            
            echo "Backup complete. Recent backups:"
            ls -la "$BACKUP_DIR" | tail -5
            # ============================================
            
            # ============================================
            # BUILD CONTAINERS FIRST (Zero Downtime Strategy)
            # ============================================
            echo "Pre-building docker images..."
            docker compose build

            # ============================================
            # PRE-MIGRATION: apply critical schema changes to the
            # CURRENTLY RUNNING postgres BEFORE stopping containers.
            # This ensures the new app version starts with the correct schema.
            # ============================================
            echo "Applying pre-migration schema fixes to running postgres..."
            docker exec cmpas-postgres psql -U postgres -d cmpas_db -c "
              ALTER TABLE \"User\" ADD COLUMN IF NOT EXISTS \"trialEndsAt\" TIMESTAMP(3);
              ALTER TABLE \"User\" ADD COLUMN IF NOT EXISTS \"maxChatId\" TEXT;
            " 2>/dev/null && echo "Pre-migration: OK" || echo "Pre-migration: skipped (postgres not running yet)"

            # CRITICAL: NEVER use "docker compose down -v" - this deletes database!
            # Only stop containers, preserve volumes
            docker compose down --timeout 30 || true

            # Prune builder cache to fix "parent snapshot does not exist" error
            echo "Pruning docker builder cache completely..."
            docker builder prune -a -f || true

            # ============================================
            # DISABLE MAIL SERVICES (conflicts with Docker mailer on port 25)
            # ============================================
            systemctl stop exim4 postfix sendmail 2>/dev/null || true
            systemctl disable exim4 postfix sendmail 2>/dev/null || true
            
            # Ensure port 25 is free right before docker compose up
            # (Building took time, so we must kill the port RIGHT before starting)
            fuser -k 25/tcp 2>/dev/null || true
            sleep 2

            # Restart containers without building (since we just built them)
            docker compose up -d --force-recreate
            
            # ============================================
            # FIX POSTGRES AUTH (PERMANENT!)
            # 
            # Problem: pg_hba.conf uses scram-sha-256 for network
            # connections, which causes intermittent auth failures
            # when Prisma's connection pool reconnects.
            #
            # Solution: Since we removed the exposed 5432 port,
            # postgres is only reachable from Docker network.
            # We switch to 'trust' auth for all connections.
            # This change persists in the volume.
            # ============================================
            echo "Waiting for postgres to be ready..."
            
            RETRIES=30
            until docker exec cmpas-postgres pg_isready -U postgres || [ $RETRIES -eq 0 ]; do
              echo "Postgres is unavailable - sleeping... ($RETRIES retries left)"
              RETRIES=$((RETRIES-1))
              sleep 2
            done
            
            if [ $RETRIES -eq 0 ]; then
              echo "Error: Postgres failed to start within timeout."
              exit 1
            fi
            
            echo "Postgres is ready. Patching pg_hba.conf for trust auth..."
            
            # Replace scram-sha-256 with trust for all host connections
            # This is safe because postgres port is NOT exposed to the host
            docker exec -u postgres cmpas-postgres sh -c "sed -i 's/host all all all scram-sha-256/host all all all trust/' /var/lib/postgresql/data/pg_hba.conf"
            docker exec -u postgres cmpas-postgres sh -c "sed -i 's/host all all all md5/host all all all trust/' /var/lib/postgresql/data/pg_hba.conf"
            
            # Reload postgres config (no restart needed)
            docker exec -u postgres cmpas-postgres pg_ctl reload -D /var/lib/postgresql/data
            echo "pg_hba.conf patched: all Docker network connections now use trust auth."
            
            # Verify pg_hba.conf
            echo "=== pg_hba.conf verification ==="
            docker exec cmpas-postgres grep -v '^#' /var/lib/postgresql/data/pg_hba.conf | grep -v '^$'
            
            # Restart app so Prisma connects with trust auth (not the old scram-sha-256)
            echo "Restarting app to use patched pg_hba.conf..."
            docker compose restart app
            sleep 3
            
            # Wait for app to be healthy
            echo "Waiting for app to start..."
            for i in {1..30}; do
              if docker compose exec -T app wget -q --spider http://localhost:3000/ 2>/dev/null; then
                echo "App is healthy!"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done
            
            # Run Database Migrations (safe - only applies new migrations)
            # First, ensure critical schema changes are applied directly (idempotent)
            echo "Applying idempotent schema fixes..."
            docker exec cmpas-postgres psql -U postgres -d cmpas_db -c "
              -- User table
              ALTER TABLE \"User\" ADD COLUMN IF NOT EXISTS \"isBlocked\" BOOLEAN NOT NULL DEFAULT false;
              ALTER TABLE \"User\" ADD COLUMN IF NOT EXISTS \"trialEndsAt\" TIMESTAMP(3);
              ALTER TABLE \"User\" ADD COLUMN IF NOT EXISTS \"maxChatId\" TEXT;
              
              -- PsychologistAddress table
              CREATE TABLE IF NOT EXISTS \"PsychologistAddress\" (
                \"id\" TEXT NOT NULL,
                \"psychologistId\" TEXT NOT NULL,
                \"name\" TEXT NOT NULL,
                \"address\" TEXT NOT NULL,
                \"createdAt\" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
                \"updatedAt\" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT \"PsychologistAddress_pkey\" PRIMARY KEY (\"id\")
              );

              -- DiaryBlock table
              CREATE TABLE IF NOT EXISTS \"DiaryBlock\" (
                \"id\" TEXT NOT NULL,
                \"psychologistId\" TEXT NOT NULL,
                \"date\" TIMESTAMP(3) NOT NULL,
                \"startTime\" TEXT NOT NULL,
                \"endTime\" TEXT NOT NULL,
                \"reason\" TEXT,
                \"type\" TEXT NOT NULL DEFAULT 'personal',
                \"createdAt\" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
                \"updatedAt\" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT \"DiaryBlock_pkey\" PRIMARY KEY (\"id\")
              );

              -- AvailabilitySlot columns
              ALTER TABLE \"AvailabilitySlot\" ADD COLUMN IF NOT EXISTS \"format\" TEXT NOT NULL DEFAULT 'online';
              ALTER TABLE \"AvailabilitySlot\" ADD COLUMN IF NOT EXISTS \"addressId\" TEXT;
              ALTER TABLE \"AvailabilitySlot\" ADD COLUMN IF NOT EXISTS \"isActive\" BOOLEAN NOT NULL DEFAULT true;
              ALTER TABLE \"AvailabilitySlot\" ADD COLUMN IF NOT EXISTS \"startDate\" TIMESTAMP(3);
              ALTER TABLE \"AvailabilitySlot\" ADD COLUMN IF NOT EXISTS \"endDate\" TIMESTAMP(3);
              ALTER TABLE \"AvailabilitySlot\" DROP COLUMN IF EXISTS \"specificDate\";

              -- DiarySession columns
              ALTER TABLE \"DiarySession\" ADD COLUMN IF NOT EXISTS \"addressId\" TEXT;

              -- CalendarIntegration columns
              ALTER TABLE "CalendarIntegration" ADD COLUMN IF NOT EXISTS "syncFrom" BOOLEAN NOT NULL DEFAULT true;

              -- PsychologistSettings columns
              ALTER TABLE \"PsychologistSettings\" ADD COLUMN IF NOT EXISTS \"fullName\" TEXT;
              ALTER TABLE \"PsychologistSettings\" ADD COLUMN IF NOT EXISTS \"sessionBreak\" INTEGER NOT NULL DEFAULT 15;
              ALTER TABLE \"PsychologistSettings\" ADD COLUMN IF NOT EXISTS \"methods\" TEXT[] DEFAULT ARRAY[]::TEXT[];
              ALTER TABLE \"PsychologistSettings\" ADD COLUMN IF NOT EXISTS \"basePrice\" INTEGER;
              ALTER TABLE \"PsychologistSettings\" ADD COLUMN IF NOT EXISTS \"scheduleMode\" TEXT NOT NULL DEFAULT 'private';

              -- NotificationSettings table
              CREATE TABLE IF NOT EXISTS \"NotificationSettings\" (
                \"id\" TEXT NOT NULL,
                \"psychologistId\" TEXT NOT NULL,
                \"newBookingEnabled\" BOOLEAN NOT NULL DEFAULT true,
                \"newBookingTemplate\" TEXT NOT NULL DEFAULT '',
                \"reminderEnabled\" BOOLEAN NOT NULL DEFAULT true,
                \"reminderMinutesBefore\" INTEGER NOT NULL DEFAULT 60,
                \"reminderTemplate\" TEXT NOT NULL DEFAULT '',
                \"clientRescheduleEnabled\" BOOLEAN NOT NULL DEFAULT true,
                \"clientCancelEnabled\" BOOLEAN NOT NULL DEFAULT true,
                \"clientReminder25hEnabled\" BOOLEAN NOT NULL DEFAULT true,
                \"clientReminder25hTemplate\" TEXT NOT NULL DEFAULT '',
                \"clientReminder1hEnabled\" BOOLEAN NOT NULL DEFAULT true,
                \"clientReminder1hTemplate\" TEXT NOT NULL DEFAULT '',
                \"clientPsyCancelEnabled\" BOOLEAN NOT NULL DEFAULT true,
                \"clientPsyCancelTemplate\" TEXT NOT NULL DEFAULT '',
                \"createdAt\" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
                \"updatedAt\" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT \"NotificationSettings_pkey\" PRIMARY KEY (\"id\"),
                CONSTRAINT \"NotificationSettings_psychologistId_key\" UNIQUE (\"psychologistId\")
              );

              DO \$\$ BEGIN
                -- Indexes
                IF NOT EXISTS (SELECT 1 FROM pg_indexes WHERE indexname = 'DiaryBlock_psychologistId_idx') THEN
                  CREATE INDEX \"DiaryBlock_psychologistId_idx\" ON \"DiaryBlock\"(\"psychologistId\");
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_indexes WHERE indexname = 'DiaryBlock_date_idx') THEN
                  CREATE INDEX \"DiaryBlock_date_idx\" ON \"DiaryBlock\"(\"date\");
                END IF;

                -- Foreign Keys
                IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'PsychologistAddress_psychologistId_fkey') THEN
                  ALTER TABLE \"PsychologistAddress\" ADD CONSTRAINT \"PsychologistAddress_psychologistId_fkey\" FOREIGN KEY (\"psychologistId\") REFERENCES \"User\"(\"id\") ON DELETE CASCADE ON UPDATE CASCADE;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'DiaryBlock_psychologistId_fkey') THEN
                  ALTER TABLE \"DiaryBlock\" ADD CONSTRAINT \"DiaryBlock_psychologistId_fkey\" FOREIGN KEY (\"psychologistId\") REFERENCES \"User\"(\"id\") ON DELETE CASCADE ON UPDATE CASCADE;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'AvailabilitySlot_addressId_fkey') THEN
                  ALTER TABLE \"AvailabilitySlot\" ADD CONSTRAINT \"AvailabilitySlot_addressId_fkey\" FOREIGN KEY (\"addressId\") REFERENCES \"PsychologistAddress\"(\"id\") ON DELETE SET NULL ON UPDATE CASCADE;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'DiarySession_addressId_fkey') THEN
                  ALTER TABLE \"DiarySession\" ADD CONSTRAINT \"DiarySession_addressId_fkey\" FOREIGN KEY (\"addressId\") REFERENCES \"PsychologistAddress\"(\"id\") ON DELETE SET NULL ON UPDATE CASCADE;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'NotificationSettings_psychologistId_fkey') THEN
                  ALTER TABLE \"NotificationSettings\" ADD CONSTRAINT \"NotificationSettings_psychologistId_fkey\" FOREIGN KEY (\"psychologistId\") REFERENCES \"User\"(\"id\") ON DELETE CASCADE ON UPDATE CASCADE;
                END IF;
              END \$\$;
            " || echo "WARNING: Direct SQL fixup failed"
            
            # Mark the migration as applied if it's not already
            docker exec cmpas-postgres psql -U postgres -d cmpas_db -c "
              INSERT INTO \"_prisma_migrations\" (\"id\", \"checksum\", \"finished_at\", \"migration_name\", \"logs\", \"rolled_back_at\", \"started_at\", \"applied_steps_count\")
              SELECT gen_random_uuid()::text, 'manual', NOW(), '20260222000000_add_advanced_scheduling', NULL, NULL, NOW(), 1
              WHERE NOT EXISTS (SELECT 1 FROM \"_prisma_migrations\" WHERE \"migration_name\" = '20260222000000_add_advanced_scheduling');
            " || echo "WARNING: Migration record insert failed"
            
            echo "Running prisma db push to apply new schema changes directly..."
            docker compose exec -T app npx prisma db push --accept-data-loss || {
              echo "WARNING: Database push failed!"
            }
            
            # ============================================
            # POST-DEPLOY VERIFICATION
            # ============================================
            echo "=== POST-DEPLOY CHECKS ==="
            echo "AUTH_SECRET fingerprint: $(grep '^AUTH_SECRET=' .env | cut -d= -f2 | cut -c1-8)..."
            
            # Verify DB connectivity from app container
            echo "Testing DB connectivity from app..."
            if docker compose exec -T app node -e "
              const { PrismaClient } = require('@prisma/client');
              const p = new PrismaClient();
              p.\$queryRaw\`SELECT 1\`.then(() => { console.log('DB OK'); process.exit(0); }).catch(e => { console.error('DB FAIL:', e.message); process.exit(1); });
            " 2>/dev/null; then
              echo "Database connectivity: OK"
            else
              echo "WARNING: Database connectivity test failed"
            fi
            
            # Verify auth endpoint
            AUTH_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/auth/session)
            echo "Auth endpoint status: $AUTH_STATUS"
            
            # ============================================
            # REGISTER MAX BOT WEBHOOK
            # ============================================
            MAX_TOKEN=$(grep '^MAX_BOT_TOKEN=' .env | cut -d= -f2)
            if [ -n "$MAX_TOKEN" ]; then
              echo "Registering MAX webhook..."
              MAX_WEBHOOK_RESULT=$(curl -s -X POST \
                "https://botapi.max.ru/subscriptions?access_token=${MAX_TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{"url":"https://cmpas.ru/api/max/webhook","version":"1","update_types":["bot_started","message_created","callback_button_pressed"]}' \
                2>/dev/null || echo "curl failed")
              echo "MAX webhook result: $MAX_WEBHOOK_RESULT"
            else
              echo "MAX_BOT_TOKEN not found, skipping webhook registration."
            fi

            # Cleanup old images
            docker image prune -f

            echo "Deployment complete!"

