name: Deploy with Docker

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android-build.yml'
      - 'sites/**'
      - '.github/workflows/deploy-moments.yml'
      - '.github/workflows/provision-moments.yml'
      - 'docs/**'
      - '.agent/**'
      - '**/*.md'
      - '.github/workflows/backup-db.yml'
      - '.backup/**'
      - '.github/workflows/db-doctor.yml'
      - '.github/workflows/db-baseline.yml'
      - 'scripts/db-doctor.sh'
      - 'scripts/db-baseline.sh'
      - 'docs/ops/**'
  push:
    branches: ["main"]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android-build.yml'
      - 'sites/**'
      - '.github/workflows/deploy-moments.yml'
      - '.github/workflows/provision-moments.yml'
      - 'docs/**'
      - '.agent/**'
      - '**/*.md'
      - '.github/workflows/backup-db.yml'
      - '.backup/**'
      - '.github/workflows/db-doctor.yml'
      - '.github/workflows/db-baseline.yml'
      - 'scripts/db-doctor.sh'
      - 'scripts/db-baseline.sh'
      - 'docs/ops/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Web preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # jsdom@30 (компонентные тесты страницы записи, добавлены в CJM v2)
          # требует Node ^22.22.2 || ^24.15.0 || >=26 — на Node 20 падает при
          # инициализации CacheStorage ("webidl.util.markAsUncloneable is not
          # a function"). channel-binding-ci.yml уже использует Node 22 —
          # эта версия принесена сюда же, а не понижением jsdom, чтобы не
          # тащить обратно устаревшие версии тестовых библиотек. Это только
          # версия Node для CI-проверки (typecheck/тесты/build), не рантайм
          # продакшен-образа — тот задаётся отдельно в Dockerfile.
          node-version: '22'
          cache: npm

      - name: Validate Prisma and build Next.js
        id: preflight
        shell: bash
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          AUTH_SECRET: build-only-secret
          AUTH_URL: http://localhost:3000
          AUTH_TRUST_HOST: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -o pipefail
          {
            npm ci --legacy-peer-deps
            npx prisma validate
            npx prisma generate
            # Тесты идут ДО сборки и до выкладки. Раньше их не запускал ни один
            # workflow: в package.json скрипт "test" существовал, но не
            # вызывался нигде, а vitest встречался во всём репозитории ровно
            # один раз — в узком стыковочном шаге android-build.yml. То есть
            # четыре с половиной сотни тестов, включая все проверки приёмника,
            # согласия и разделения секретов, существовали и не выполнялись
            # никогда. «Зелёный CI» по этим тестам не значил ничего.
            npm test
            npm run build
            touch .env
            docker compose config --quiet
          } 2>&1 | tee preflight.log

      - name: Upload preflight diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-preflight-${{ github.sha }}
          path: preflight.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish preflight failure issue
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'preflight.log';
            const raw = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'preflight.log was not created';
            const tail = raw.slice(-60000).replaceAll('```', '---');
            const title = `[deploy-failure] Web preflight ${context.sha.slice(0, 7)}`;
            const body = [
              `Commit: ${context.sha}`,
              `Workflow: ${context.workflow}`,
              '',
              '```text',
              tail,
              '```',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });

  deploy:
    name: Atomic production deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
      YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
      MAX_BOT_USERNAME: ${{ secrets.MAX_BOT_USERNAME }}
      DADATA_API_KEY: ${{ secrets.DADATA_API_KEY }}
      MIERU_SERVER: ${{ secrets.MIERU_SERVER }}
      MIERU_PORT: ${{ secrets.MIERU_PORT }}
      MIERU_USERNAME: ${{ secrets.MIERU_USERNAME }}
      MIERU_PASSWORD: ${{ secrets.MIERU_PASSWORD }}
      # Эквайринг Т-Банк: два раздельных терминала — сайт и приложение.
      TINKOFF_TERMINAL_KEY: ${{ secrets.TINKOFF_TERMINAL_KEY }}
      TINKOFF_PASSWORD: ${{ secrets.TINKOFF_PASSWORD }}
      TINKOFF_APP_TERMINAL_KEY: ${{ secrets.TINKOFF_APP_TERMINAL_KEY }}
      TINKOFF_APP_PASSWORD: ${{ secrets.TINKOFF_APP_PASSWORD }}
      # Почта из админки. Вход по ссылке идёт не сюда, а через контейнер mailer.
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      # Задача G5: карточка «Стоимость инфраструктуры» — деплой сам кладёт
      # значение в SystemConfig, если секрет задан (см. scripts/deploy-production-remote.sh).
      # Без этой строки и без имени в envs: ниже секрет GitHub никогда не
      # доедет до раннера, а без второго — до самого деплой-скрипта: он
      # просто останется пустым, и блок в скрипте честно ничего не сделает.
      # Число не выдумано — секрета с этим именем в репозитории пока нет,
      # завести его (Settings → Secrets and variables → Actions) остаётся
      # человеку, который знает фактическую стоимость сервера.
      INFRA_COST_RUB: ${{ secrets.INFRA_COST_RUB }}
      # Секрет приёмника аналитики. Выкладка умеет родить его сама на сервере
      # (scripts/deploy-production-remote.sh), и для ПРАКТИКИ с ЗАПИСКАМИ
      # этого достаточно: сосед берёт значение из общего файла на той же
      # машине. Но МОМЕНТЫ — приложение: их секрет зашивается в сборку на
      # раннере GitHub, до сервера ему не дотянуться. Единственная точка, где
      # значение может совпасть у всех троих, — секрет уровня организации с
      # этим именем. Поэтому он обязан доезжать и сюда: если человек его
      # завёл, сервер берёт ЕГО, а не рождает свой, и сборка МОМЕНТОВ
      # сходится с приёмником. Если не завёл — сервер рождает свой, ПРАКТИКА
      # и ЗАПИСКИ работают, а сборка МОМЕНТОВ честно падает с объяснением.
      ANALYTICS_INGEST_SECRET: ${{ secrets.ANALYTICS_INGEST_SECRET }}
      # Отдельный секрет МОМЕНТОВ. Общий секрет выше теперь действует только
      # для practice и zapiski (src/lib/analytics/secrets.ts): МОМЕНТЫ —
      # публикуемое приложение, а секрет внутри публикуемого APK извлекается
      # из скачанного файла за минуты. С одним общим секретом публикация
      # приложения публиковала бы ключ от приёма всех трёх продуктов; с
      # раздельными компрометация даёт возможность слать только события
      # МОМЕНТОВ.
      #
      # Пока переменная не задана, приёмник просто не знает такого секрета и
      # отвечает 401 — ровно то, что происходит с МОМЕНТАМИ и сегодня: их
      # клиент не шлёт заголовок Authorization вовсе.
      ANALYTICS_INGEST_SECRET_MOMENTS: ${{ secrets.ANALYTICS_INGEST_SECRET_MOMENTS }}
    steps:
      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 45m
          envs: YANDEX_CLIENT_ID,YANDEX_CLIENT_SECRET,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,MAX_BOT_TOKEN,MAX_BOT_USERNAME,DADATA_API_KEY,MIERU_SERVER,MIERU_PORT,MIERU_USERNAME,MIERU_PASSWORD,TINKOFF_TERMINAL_KEY,TINKOFF_PASSWORD,TINKOFF_APP_TERMINAL_KEY,TINKOFF_APP_PASSWORD,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASSWORD,SMTP_FROM,INFRA_COST_RUB,ANALYTICS_INGEST_SECRET,ANALYTICS_INGEST_SECRET_MOMENTS
          script: |
            set -e
            cd /var/www/cmpas.ru
            git fetch origin main
            git reset --hard origin/main
            bash -lc 'set +e; bash scripts/deploy-production-remote.sh 2>&1 | tee /tmp/cmpas-deploy.log; status=${PIPESTATUS[0]}; exit ${status}'

      - name: Download remote deploy log
        if: failure()
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: /tmp/cmpas-deploy.log
          target: deploy-diagnostics
          strip_components: 1

      - name: Upload deploy diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-${{ github.sha }}
          path: deploy-diagnostics/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish deploy failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            function findLog(dir) {
              if (!fs.existsSync(dir)) return null;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  const nested = findLog(full);
                  if (nested) return nested;
                } else if (entry.name === 'cmpas-deploy.log') {
                  return full;
                }
              }
              return null;
            }
            const logPath = findLog('deploy-diagnostics');
            const raw = logPath ? fs.readFileSync(logPath, 'utf8') : 'Remote deploy log could not be downloaded.';
            const tail = raw.slice(-60000).replaceAll('```', '---');
            const title = `[deploy-failure] Production deploy ${context.sha.slice(0, 7)}`;
            const body = [
              `Commit: ${context.sha}`,
              `Workflow: ${context.workflow}`,
              '',
              '```text',
              tail,
              '```',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
