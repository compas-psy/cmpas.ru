name: Deploy with Docker

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android-build.yml'
      - 'sites/**'
      - '.github/workflows/deploy-moments.yml'
      - '.github/workflows/provision-moments.yml'
      - 'docs/**'
      - '.agent/**'
      - '**/*.md'
      - '.github/workflows/backup-db.yml'
      - '.backup/**'
      - '.github/workflows/db-doctor.yml'
      - '.github/workflows/db-baseline.yml'
      - 'scripts/db-doctor.sh'
      - 'scripts/db-baseline.sh'
      - 'docs/ops/**'
  push:
    branches: ["main"]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android-build.yml'
      - 'sites/**'
      - '.github/workflows/deploy-moments.yml'
      - '.github/workflows/provision-moments.yml'
      - 'docs/**'
      - '.agent/**'
      - '**/*.md'
      - '.github/workflows/backup-db.yml'
      - '.backup/**'
      - '.github/workflows/db-doctor.yml'
      - '.github/workflows/db-baseline.yml'
      - 'scripts/db-doctor.sh'
      - 'scripts/db-baseline.sh'
      - 'docs/ops/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Web preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validate Prisma and build Next.js
        id: preflight
        shell: bash
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          AUTH_SECRET: build-only-secret
          AUTH_URL: http://localhost:3000
          AUTH_TRUST_HOST: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -o pipefail
          {
            npm ci --legacy-peer-deps
            npx prisma validate
            npx prisma generate
            npm run build
            touch .env
            docker compose config --quiet
          } 2>&1 | tee preflight.log

      - name: Upload preflight diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-preflight-${{ github.sha }}
          path: preflight.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish preflight failure issue
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'preflight.log';
            const raw = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'preflight.log was not created';
            const tail = raw.slice(-60000).replaceAll('```', '---');
            const title = `[deploy-failure] Web preflight ${context.sha.slice(0, 7)}`;
            const body = [
              `Commit: ${context.sha}`,
              `Workflow: ${context.workflow}`,
              '',
              '```text',
              tail,
              '```',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });

  deploy:
    name: Atomic production deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
      YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
      MAX_BOT_USERNAME: ${{ secrets.MAX_BOT_USERNAME }}
      DADATA_API_KEY: ${{ secrets.DADATA_API_KEY }}
      MIERU_SERVER: ${{ secrets.MIERU_SERVER }}
      MIERU_PORT: ${{ secrets.MIERU_PORT }}
      MIERU_USERNAME: ${{ secrets.MIERU_USERNAME }}
      MIERU_PASSWORD: ${{ secrets.MIERU_PASSWORD }}
      # Эквайринг Т-Банк: два раздельных терминала — сайт и приложение.
      TINKOFF_TERMINAL_KEY: ${{ secrets.TINKOFF_TERMINAL_KEY }}
      TINKOFF_PASSWORD: ${{ secrets.TINKOFF_PASSWORD }}
      TINKOFF_APP_TERMINAL_KEY: ${{ secrets.TINKOFF_APP_TERMINAL_KEY }}
      TINKOFF_APP_PASSWORD: ${{ secrets.TINKOFF_APP_PASSWORD }}
      # Почта из админки. Вход по ссылке идёт не сюда, а через контейнер mailer.
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
    steps:
      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 45m
          envs: YANDEX_CLIENT_ID,YANDEX_CLIENT_SECRET,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,MAX_BOT_TOKEN,MAX_BOT_USERNAME,DADATA_API_KEY,MIERU_SERVER,MIERU_PORT,MIERU_USERNAME,MIERU_PASSWORD,TINKOFF_TERMINAL_KEY,TINKOFF_PASSWORD,TINKOFF_APP_TERMINAL_KEY,TINKOFF_APP_PASSWORD,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASSWORD,SMTP_FROM
          script: |
            set -e
            cd /var/www/cmpas.ru
            git fetch origin main
            git reset --hard origin/main
            bash -lc 'set +e; bash scripts/deploy-production-remote.sh 2>&1 | tee /tmp/cmpas-deploy.log; status=${PIPESTATUS[0]}; exit ${status}'

      - name: Download remote deploy log
        if: failure()
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: /tmp/cmpas-deploy.log
          target: deploy-diagnostics
          strip_components: 1

      - name: Upload deploy diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-${{ github.sha }}
          path: deploy-diagnostics/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish deploy failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            function findLog(dir) {
              if (!fs.existsSync(dir)) return null;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  const nested = findLog(full);
                  if (nested) return nested;
                } else if (entry.name === 'cmpas-deploy.log') {
                  return full;
                }
              }
              return null;
            }
            const logPath = findLog('deploy-diagnostics');
            const raw = logPath ? fs.readFileSync(logPath, 'utf8') : 'Remote deploy log could not be downloaded.';
            const tail = raw.slice(-60000).replaceAll('```', '---');
            const title = `[deploy-failure] Production deploy ${context.sha.slice(0, 7)}`;
            const body = [
              `Commit: ${context.sha}`,
              `Workflow: ${context.workflow}`,
              '',
              '```text',
              tail,
              '```',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
