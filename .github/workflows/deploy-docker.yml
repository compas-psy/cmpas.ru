name: Deploy with Docker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            cd /var/www/cmpas.ru
            
            # Update .env file for Docker build context
            cat <<EOF > .env
            DATABASE_URL=${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@postgres:5432/cmpas_db' }}
            YANDEX_CLIENT_ID=${{ secrets.YANDEX_CLIENT_ID || '1b261cbc153045beb7d707389fc27515' }}
            YANDEX_CLIENT_SECRET=${{ secrets.YANDEX_CLIENT_SECRET || 'b3b7316b0f72442485f441c63ba59cba' }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET || 'changeme-in-production-please-secret-key' }}
            EMAIL_SERVER_HOST=mailer
            EMAIL_SERVER_PORT=25
            EMAIL_FROM=noreply@cmpas.ru
            AUTH_TRUST_HOST=true
            AUTH_URL=https://cmpas.ru
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
            EOF
            
            # Stop old PM2 if running
            pm2 stop cmpas-app 2>/dev/null || true
            pm2 delete cmpas-app 2>/dev/null || true
            
            # UPDATE CODE
            git stash 2>/dev/null || true
            git pull origin main
            
            # ============================================
            # DATABASE BACKUP (CRITICAL - DO NOT SKIP!)
            # ============================================
            BACKUP_DIR="/var/backups/cmpas"
            mkdir -p "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/db_backup_$(date +%Y%m%d_%H%M%S).sql"
            
            echo "Creating database backup: $BACKUP_FILE"
            docker exec cmpas-postgres pg_dump -U postgres -d cmpas_db > "$BACKUP_FILE" 2>/dev/null || echo "Warning: Could not create backup (database may be new)"
            
            # Keep only last 10 backups
            ls -t "$BACKUP_DIR"/db_backup_*.sql 2>/dev/null | tail -n +11 | xargs rm -f 2>/dev/null || true
            
            echo "Backup complete. Recent backups:"
            ls -la "$BACKUP_DIR" | tail -5
            # ============================================
            
            # Ensure port 25 is free (ALWAYS occupied by another service on this server)
            fuser -k 25/tcp 2>/dev/null || true
            
            # CRITICAL: NEVER use "docker compose down -v" - this deletes database!
            # Only stop containers, preserve volumes
            docker compose down --timeout 30 || true
            
            # Rebuild and restart containers
            docker compose up -d --build --force-recreate
            
            # Wait for app to be healthy
            echo "Waiting for app to start..."
            for i in {1..30}; do
              if docker compose exec -T app wget -q --spider http://localhost:3000/ 2>/dev/null; then
                echo "App is healthy!"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done
            
            # Run Database Migrations (safe - only applies new migrations)
            docker compose exec -T app node node_modules/prisma/build/index.js migrate deploy 2>/dev/null || true
            
            # Cleanup old images
            docker image prune -f
            
            echo "Deployment complete!"
