name: Deploy with Docker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            cd /var/www/cmpas.ru
            
            # Update .env.local with safe defaults if secrets are missing
            # Using values known from repo .env for robustness
            cat <<EOF > .env.local
            DATABASE_URL=${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@postgres:5432/cmpas_db' }}
            YANDEX_CLIENT_ID=${{ secrets.YANDEX_CLIENT_ID || '1b261cbc153045beb7d707389fc27515' }}
            YANDEX_CLIENT_SECRET=${{ secrets.YANDEX_CLIENT_SECRET || 'b3b7316b0f72442485f441c63ba59cba' }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET || 'changeme-in-production-please-secret-key' }}
            EMAIL_SERVER_HOST=mailer
            EMAIL_SERVER_PORT=25
            EMAIL_FROM=noreply@cmpas.ru
            AUTH_TRUST_HOST=true
            AUTH_URL=https://cmpas.ru
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
            EOF
            
            # Stop old PM2 if running
            pm2 stop cmpas-app || true
            pm2 delete cmpas-app || true
            
            # UPDATE CODE
            git stash
            git pull origin main
            
            # Rebuild and restart
            # Ensure port 25 is free (kill conflicting mail process)
            apt-get update && apt-get install -y psmisc
            fuser -k 25/tcp || true

            # Rebuild and restart containers
            rm -rf .next
            docker compose up -d --build

            # Run Database Migrations using local Prisma CLI (v5.22.0)
            sleep 10
            docker compose exec -T app node node_modules/prisma/build/index.js migrate deploy
            
            docker image prune -f
