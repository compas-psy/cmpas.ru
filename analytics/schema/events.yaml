# Event registry for POST /ingest (charter/12_ANALYTICS.md §3, charter/13_TRACKING_PLAN.md §6).
#
# An event not listed here, or a prop not listed under its event, is rejected
# by src/lib/analytics/schema.ts and lands in events_rejected — never in
# events. No event may carry free text (charter/12_ANALYTICS.md, правило 2).
#
# Every event implicitly has the envelope fields: event, ts, product,
# account_id, device_id, schema_version — those are validated separately,
# not listed per-event below. account_id and device_id are each optional,
# but at least one is required (O-260817-13: a device without an account —
# МОМЕНТЫ has none, ЗАПИСКИ has no production login yet — sends device_id
# alone).
#
#
# O-260817-17: this file is the single registry every product submits
# through (charter/12_ANALYTICS.md §3 treats the receiver as shared —
# "второй сервер не строим", decided for МОМЕНТЫ in O-260817-14). Each
# event below carries `product`, which of the three products may send it;
# submitting a real event under the wrong product is rejected exactly like
# submitting an unknown event (src/lib/analytics/schema.ts). ЗАПИСКИ and
# МОМЕНТЫ keep their own copy of these event names/props in their own
# repos for their client code (packages/core/src/analytics/schema.ts in
# zapiski, AnalyticsSchema.kt in compas-voice) — this file must stay a
# superset of both, checked by tests/registry-sync.test.ts, not by eye.
# ЗАПИСКИ today posts to its own backend (POST /api/v1/analytics/events,
# O-260817-05), not to this /ingest — its events are consolidated here
# regardless, per this order's instruction; retargeting its transport is a
# separate decision this order does not make.
#
# E1 (контракт контура v2 п.6): `product` is normally a single string, but
# consent_updated and identity_linked belong to all three products at
# once — written below as a YAML list ([practice, zapiski, moments]).
# src/lib/analytics/schema.ts accepts either shape; every other event
# keeps one string because it genuinely belongs to one product.

version: 1

products:
  - practice
  - zapiski
  - moments

events:
  # Identity (charter/12_ANALYTICS.md §2) — links a pre-login device to an
  # account, written once at the moment of login. All three products (E1,
  # контракт контура v2 п.6).
  identity_linked:
    product: [practice, zapiski, moments]
    required: []
    optional: []

  # Consent gate (this order's rule: no device_id before consent). All
  # three products (E1, контракт контура v2 п.6) — ЗАПИСКИ and МОМЕНТЫ
  # must be able to grant their own subject's consent themselves; see
  # src/lib/analytics/ingest.ts for how that subject is keyed.
  consent_updated:
    product: [practice, zapiski, moments]
    required: [granted]
    optional: []
    props:
      granted: boolean

  # Billing — Т-Банк (charter/13_TRACKING_PLAN.md §6). Never carries
  # rebillId, tinkoffPaymentId, or a terminal password.
  payment_initiated:
    product: practice
    required: [terminal, plan, amount, months]
    optional: []
    props:
      terminal: string
      plan: string
      amount: number
      months: number

  payment_succeeded:
    product: practice
    required: [terminal, plan, amount, months]
    optional: []
    props:
      terminal: string
      plan: string
      amount: number
      months: number

  payment_failed:
    product: practice
    required: [terminal, plan, reason]
    optional: []
    props:
      terminal: string
      plan: string
      reason: string

  subscription_started:
    product: practice
    required: [terminal, plan, months]
    optional: []
    props:
      terminal: string
      plan: string
      months: number

  subscription_renewed:
    product: practice
    required: [terminal, plan, months]
    optional: []
    props:
      terminal: string
      plan: string
      months: number

  subscription_churned:
    product: practice
    required: [terminal, plan, months]
    optional: []
    props:
      terminal: string
      plan: string
      months: number

  # Семь событий мобильного приложения ПРАКТИКИ (android/**, отдельный
  # агент). Приложение шлёт их на POST /api/mobile/analytics со своим
  # обычным пользовательским JWT — секрет ANALYTICS_INGEST_SECRET_* в APK не
  # кладём (см. src/lib/analytics/secrets.ts); сервер сам подставляет
  # product:'practice' и account_id из токена и прогоняет их через тот же
  # processIngestEvent/этот же реестр. device_id приложение не отправляет
  # никогда — колонка остаётся null для этих событий. Значения перечислений
  # (surface/to/mode/channel/*_bucket) объявлены в `values` и проверяются
  # src/lib/analytics/schema.ts после проверки типов. Ни одно свойство не
  # несёт текст, id клиента, id сессии или точное время сессии.
  app_opened:
    product: practice
    question: "Насколько часто открывают приложение — и с какой поверхности?"
    required: [surface]
    optional: [first_launch]
    props:
      surface: string
      first_launch: boolean
    values:
      surface: [android]

  session_created:
    product: practice
    question: "Создаются ли сессии из приложения, и заранее ли (насколько)?"
    required: [surface, delivered]
    optional: [repeat_batch, days_ahead_bucket]
    props:
      surface: string
      delivered: boolean
      repeat_batch: boolean
      days_ahead_bucket: string
    values:
      surface: [android]
      days_ahead_bucket: [past, same_day, within_week, within_month, later]

  session_status_changed:
    product: practice
    question: "Как меняют статус сессии из приложения — куда именно?"
    required: [surface, to, delivered]
    optional: []
    props:
      surface: string
      to: string
      delivered: boolean
    values:
      surface: [android]
      to: [confirmed, completed, cancelled, rescheduled]

  session_note_saved:
    product: practice
    question: "Сохраняют ли заметки по сессии из приложения, каким режимом и как быстро после сессии?"
    required: [surface, delivered, mode]
    optional: [blocks_filled, since_session_bucket]
    props:
      surface: string
      delivered: boolean
      mode: string
      blocks_filled: number
      since_session_bucket: string
    values:
      surface: [android]
      mode: [short, blocks]
      since_session_bucket: [before_session, same_day, next_day, within_week, later]
    range:
      blocks_filled: [0, 5]

  session_note_abandoned:
    product: practice
    question: "Начинают заметку и бросают — с введённым текстом или пустую?"
    required: [surface, had_input]
    optional: []
    props:
      surface: string
      had_input: boolean
    values:
      surface: [android]

  client_created:
    product: practice
    question: "Заводят ли клиентов из приложения?"
    required: [surface, delivered]
    optional: []
    props:
      surface: string
      delivered: boolean
    values:
      surface: [android]

  client_invite_created:
    product: practice
    question: "Приглашают ли клиентов на самозапись из приложения, каким каналом?"
    required: [surface, channel, delivered]
    optional: []
    props:
      surface: string
      channel: string
      delivered: boolean
    values:
      surface: [android]
      channel: [telegram, max, auto]

  # ЗАПИСКИ (source of truth for the client: zapiski's own
  # packages/core/src/analytics/schema.ts). Snapshot taken 18.08.2026.
  # `length_bucket`/`query_length_bucket`/`format` are enums client-side
  # (packages/core/src/analytics/schema.ts:27-50); this registry's type
  # language has no enum, so they're recorded as `string` here — the
  # narrower value set is enforced by the zapiski client, not re-enforced
  # server-side. Named in the PR, not silent.
  note_saved:
    product: zapiski
    question: "Люди действительно сохраняют заметки — и как часто пишут длинные?"
    required: []
    optional: [length_bucket, encrypted]
    props:
      length_bucket: string
      encrypted: boolean

  note_searched:
    product: zapiski
    question: "Работает ли поиск как основной способ найти заметку?"
    required: []
    optional: [query_length_bucket, results_count]
    props:
      query_length_bucket: string
      results_count: number

  sync_completed:
    product: zapiski
    question: "Синк вообще случается, и с каким объёмом изменений?"
    required: []
    optional: [pushed, pulled, conflicts]
    props:
      pushed: number
      pulled: number
      conflicts: number

  export_requested:
    product: zapiski
    question: "Каким форматом экспорта пользуются и насколько массово?"
    required: []
    optional: [format, notes_count]
    props:
      format: string
      notes_count: number

  # МОМЕНТЫ (source of truth for the client: compas-voice's own
  # AnalyticsSchema.kt). Snapshot taken 18.08.2026. `completion_pct` is
  # `integer` client-side; this registry's type language has no integer,
  # recorded as `number` (a JS/TS number check already accepts it).
  app_installed:
    product: moments
    question: "Сколько холодных запусков — и сколько из них доходят до первой практики в тот же день (агрегация на витрине)?"
    required: []
    optional: []

  practice_started:
    product: moments
    question: "Практика запущена (тап «Начать» в шите) — какая и из какой группы?"
    required: []
    optional: [practice_id, group, is_sleep]
    props:
      practice_id: string
      group: string
      is_sleep: boolean

  practice_finished:
    product: moments
    question: "Практика завершена (доиграла, угасла или закрыта вручную) — насколько досмотрена?"
    required: []
    optional: [practice_id, group, is_sleep, completion_pct]
    props:
      practice_id: string
      group: string
      is_sleep: boolean
      completion_pct: number

  crossed_to_product:
    product: moments
    question: "Переходят ли из МОМЕНТОВ в другой продукт СИМПАС? (нет UI-точки на 18.08.2026, схема готова заранее)"
    required: []
    optional: [target_product]
    props:
      target_product: string
