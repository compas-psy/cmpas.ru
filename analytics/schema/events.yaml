# Event registry for POST /ingest (charter/12_ANALYTICS.md §3, charter/13_TRACKING_PLAN.md §6).
#
# An event not listed here, or a prop not listed under its event, is rejected
# by src/lib/analytics/schema.ts and lands in events_rejected — never in
# events. No event may carry free text (charter/12_ANALYTICS.md, правило 2).
#
# Every event implicitly has the envelope fields: event, ts, product,
# account_id, device_id, schema_version — those are validated separately,
# not listed per-event below. account_id and device_id are each optional,
# but at least one is required (O-260817-13: a device without an account —
# МОМЕНТЫ has none, ЗАПИСКИ has no production login yet — sends device_id
# alone).
#
#
# O-260817-17: this file is the single registry every product submits
# through (charter/12_ANALYTICS.md §3 treats the receiver as shared —
# "второй сервер не строим", decided for МОМЕНТЫ in O-260817-14). Each
# event below carries `product`, which of the three products may send it;
# submitting a real event under the wrong product is rejected exactly like
# submitting an unknown event (src/lib/analytics/schema.ts). ЗАПИСКИ and
# МОМЕНТЫ keep their own copy of these event names/props in their own
# repos for their client code (packages/core/src/analytics/schema.ts in
# zapiski, AnalyticsSchema.kt in compas-voice) — this file must stay a
# superset of both, checked by tests/registry-sync.test.ts, not by eye.
# ЗАПИСКИ today posts to its own backend (POST /api/v1/analytics/events,
# O-260817-05), not to this /ingest — its events are consolidated here
# regardless, per this order's instruction; retargeting its transport is a
# separate decision this order does not make.
#
# E1 (контракт контура v2 п.6): `product` is normally a single string, but
# consent_updated and identity_linked belong to all three products at
# once — written below as a YAML list ([practice, zapiski, moments]).
# src/lib/analytics/schema.ts accepts either shape; every other event
# keeps one string because it genuinely belongs to one product.

version: 1

products:
  - practice
  - zapiski
  - moments

events:
  # Identity (charter/12_ANALYTICS.md §2) — links a pre-login device to an
  # account, written once at the moment of login. All three products (E1,
  # контракт контура v2 п.6).
  identity_linked:
    product: [practice, zapiski, moments]
    required: []
    optional: []

  # Consent gate (this order's rule: no device_id before consent). All
  # three products (E1, контракт контура v2 п.6) — ЗАПИСКИ and МОМЕНТЫ
  # must be able to grant their own subject's consent themselves; see
  # src/lib/analytics/ingest.ts for how that subject is keyed.
  consent_updated:
    product: [practice, zapiski, moments]
    required: [granted]
    optional: []
    props:
      granted: boolean

  # Billing — Т-Банк (charter/13_TRACKING_PLAN.md §6). Never carries
  # rebillId, tinkoffPaymentId, or a terminal password.
  payment_initiated:
    product: practice
    required: [terminal, plan, amount, months]
    optional: []
    props:
      terminal: string
      plan: string
      amount: number
      months: number

  payment_succeeded:
    product: practice
    required: [terminal, plan, amount, months]
    optional: []
    props:
      terminal: string
      plan: string
      amount: number
      months: number

  payment_failed:
    product: practice
    required: [terminal, plan, reason]
    optional: []
    props:
      terminal: string
      plan: string
      reason: string

  subscription_started:
    product: practice
    required: [terminal, plan, months]
    optional: []
    props:
      terminal: string
      plan: string
      months: number

  subscription_renewed:
    product: practice
    required: [terminal, plan, months]
    optional: []
    props:
      terminal: string
      plan: string
      months: number

  subscription_churned:
    product: practice
    required: [terminal, plan, months]
    optional: []
    props:
      terminal: string
      plan: string
      months: number

  # Семь событий мобильного приложения ПРАКТИКИ (android/**, отдельный
  # агент). Приложение шлёт их на POST /api/mobile/analytics со своим
  # обычным пользовательским JWT — секрет ANALYTICS_INGEST_SECRET_* в APK не
  # кладём (см. src/lib/analytics/secrets.ts); сервер сам подставляет
  # product:'practice' и account_id из токена и прогоняет их через тот же
  # processIngestEvent/этот же реестр. device_id приложение не отправляет
  # никогда — колонка остаётся null для этих событий. Значения перечислений
  # (surface/to/mode/channel/*_bucket) объявлены в `values` и проверяются
  # src/lib/analytics/schema.ts после проверки типов. Ни одно свойство не
  # несёт текст, id клиента, id сессии или точное время сессии.
  app_opened:
    product: practice
    question: "Насколько часто открывают приложение — и с какой поверхности?"
    required: [surface]
    optional: [first_launch]
    props:
      surface: string
      first_launch: boolean
    values:
      surface: [android]

  session_created:
    product: practice
    question: "Создаются ли сессии из приложения, и заранее ли (насколько)?"
    required: [surface, delivered]
    optional: [repeat_batch, days_ahead_bucket]
    props:
      surface: string
      delivered: boolean
      repeat_batch: boolean
      days_ahead_bucket: string
    values:
      surface: [android]
      days_ahead_bucket: [past, same_day, within_week, within_month, later]

  session_status_changed:
    product: practice
    question: "Как меняют статус сессии из приложения — куда именно?"
    required: [surface, to, delivered]
    optional: []
    props:
      surface: string
      to: string
      delivered: boolean
    values:
      surface: [android]
      to: [confirmed, completed, cancelled, rescheduled]

  session_note_saved:
    product: practice
    question: "Сохраняют ли заметки по сессии из приложения, каким режимом и как быстро после сессии?"
    required: [surface, delivered, mode]
    optional: [blocks_filled, since_session_bucket]
    props:
      surface: string
      delivered: boolean
      mode: string
      blocks_filled: number
      since_session_bucket: string
    values:
      surface: [android]
      mode: [short, blocks]
      since_session_bucket: [before_session, same_day, next_day, within_week, later]
    range:
      blocks_filled: [0, 5]

  session_note_abandoned:
    product: practice
    question: "Начинают заметку и бросают — с введённым текстом или пустую?"
    required: [surface, had_input]
    optional: []
    props:
      surface: string
      had_input: boolean
    values:
      surface: [android]

  client_created:
    product: practice
    question: "Заводят ли клиентов из приложения?"
    required: [surface, delivered]
    optional: []
    props:
      surface: string
      delivered: boolean
    values:
      surface: [android]

  client_invite_created:
    product: practice
    question: "Приглашают ли клиентов на самозапись из приложения, каким каналом?"
    required: [surface, channel, delivered]
    optional: []
    props:
      surface: string
      channel: string
      delivered: boolean
    values:
      surface: [android]
      channel: [telegram, max, auto]

  # O-260829 §7 (ПРАКТИКА · CJM записи: пакетное ТЗ на исправление, v2) —
  # пост-сессионный каскад (§5.4). ТЗ ссылается на handoff §7 (PRACTICE_
  # handoff_booking.md), которого в репозитории нет (см. §1 самого ТЗ:
  # "PRACTICE_handoff_booking.md — подтверждено, в репозитории НЕТ") — как и
  # событий booking_confirmed/booking_cancelled/slot_resold, которые ТЗ
  # просит только точечно поправить (убрать/переименовать prop), считая их
  # уже существующими. Ни в этом реестре, ни где-либо в коде их нет — весь
  # клиентский путь записи (бот/веб) сегодня не инструментирован аналитикой
  # вовсе, инструментирован только Android-путь выше. Не изобретаю
  # недостающие booking_confirmed/booking_cancelled/waitlist_slot_offered
  # целиком (required/optional за пределами того, что назвало само ТЗ) —
  # это была бы аналитика для несуществующей интеграции, а не правка
  # существующей. Ниже — только то, что описано ТЗ полностью и опирается на
  # реально реализованный в этом заходе код (§5.4): факт вечерней отметки
  # специалиста и факт отправки двух новых сообщений каскада. no_show
  # ("добавить, если отсутствует — нужен для нового поля outcome из §5.4")
  # добавлен явно по этой инструкции, с единственным названным ТЗ prop'ом.
  session_outcome_marked:
    product: practice
    question: "Как часто и через сколько после конца сессии специалист отмечает её исход?"
    required: [outcome, hours_after_end]
    optional: []
    props:
      outcome: string
      hours_after_end: number
    values:
      outcome: [completed, no_show]

  rebooking_nudge_sent:
    product: practice
    question: "Как часто клиенту уходит предложение ближайшего времени через 2 часа после сессии?"
    required: []
    optional: []

  weekly_followup_sent:
    product: practice
    question: "Как часто клиенту уходит напоминание о записи через неделю без новой брони?"
    required: []
    optional: []

  no_show:
    product: practice
    question: "Не пришедший клиент — новый или уже бывавший?"
    required: [is_returning]
    optional: []
    props:
      is_returning: boolean

  # ЗАПИСКИ (source of truth for the client: zapiski's own
  # packages/core/src/analytics/schema.ts). Snapshot taken 18.08.2026.
  # `length_bucket`/`query_length_bucket`/`format` are enums client-side
  # (packages/core/src/analytics/schema.ts:27-50); this registry's type
  # language has no enum, so they're recorded as `string` here — the
  # narrower value set is enforced by the zapiski client, not re-enforced
  # server-side. Named in the PR, not silent.
  note_saved:
    product: zapiski
    question: "Люди действительно сохраняют заметки — и как часто пишут длинные?"
    required: []
    optional: [length_bucket, encrypted]
    props:
      length_bucket: string
      encrypted: boolean

  note_searched:
    product: zapiski
    question: "Работает ли поиск как основной способ найти заметку?"
    required: []
    optional: [query_length_bucket, results_count]
    props:
      query_length_bucket: string
      results_count: number

  sync_completed:
    product: zapiski
    question: "Синк вообще случается, и с каким объёмом изменений?"
    required: []
    optional: [pushed, pulled, conflicts]
    props:
      pushed: number
      pulled: number
      conflicts: number

  export_requested:
    product: zapiski
    question: "Каким форматом экспорта пользуются и насколько массово?"
    required: []
    optional: [format, notes_count]
    props:
      format: string
      notes_count: number

  # МОМЕНТЫ (source of truth for the client: compas-voice's own
  # AnalyticsSchema.kt). Snapshot taken 18.08.2026. `completion_pct` is
  # `integer` client-side; this registry's type language has no integer,
  # recorded as `number` (a JS/TS number check already accepts it).
  app_installed:
    product: moments
    question: "Сколько холодных запусков — и сколько из них доходят до первой практики в тот же день (агрегация на витрине)?"
    required: []
    optional: []

  practice_started:
    product: moments
    question: "Практика запущена (тап «Начать» в шите) — какая и из какой группы?"
    required: []
    optional: [practice_id, group, is_sleep]
    props:
      practice_id: string
      group: string
      is_sleep: boolean

  practice_finished:
    product: moments
    question: "Практика завершена (доиграла, угасла или закрыта вручную) — насколько досмотрена?"
    required: []
    optional: [practice_id, group, is_sleep, completion_pct]
    props:
      practice_id: string
      group: string
      is_sleep: boolean
      completion_pct: number

  crossed_to_product:
    product: moments
    question: "Переходят ли из МОМЕНТОВ в другой продукт СИМПАС? (нет UI-точки на 18.08.2026, схема готова заранее)"
    required: []
    optional: [target_product]
    props:
      target_product: string

  # ── ПРАКТИКА MVP, Задача 25: наблюдаемость запуска ──────────────────────
  #
  # Десять событий, и ни одного сверх них. Правило по props жёстче общего:
  # разрешены только счётчики, provider, source и машинный error_code, и все
  # строковые props перечислены через `values` — произвольная строка не
  # проходит ни в одном из них.
  #
  # Здесь НЕТ и не должно появиться: имени, телефона, почты, заметок,
  # названия события календаря, адреса, имени файла, идентификатора клиента
  # или сессии, токена записи или приглашения. Ни под своим именем, ни
  # спрятанным внутрь source/error_code — оттого они и enum, а не string.
  #
  # correlation_id для разбора инцидентов живёт в логах и в теле ответа об
  # ошибке, но не здесь: поведенческой аналитике он не нужен, а уникальный
  # идентификатор запроса — это ниточка к конкретному человеку.

  practice_migration_started:
    product: practice
    question: "Начинают ли перенос практики — и откуда?"
    required: [source]
    optional: [provider]
    props:
      source: string
      provider: string
    values:
      source: [calendar, spreadsheet]
      provider: [google, yandex, csv, xlsx, paste]

  practice_migration_previewed:
    product: practice
    question: "Что показал разбор переносимого: сколько готово, сколько требует решения?"
    required: [source, items_count]
    optional: [provider, ready_count, review_count, personal_count, skipped_count, error_count]
    props:
      source: string
      provider: string
      items_count: number
      ready_count: number
      review_count: number
      personal_count: number
      skipped_count: number
      error_count: number
    values:
      source: [calendar, spreadsheet]
      provider: [google, yandex, csv, xlsx, paste]
    range:
      items_count: [0, 100000]
      ready_count: [0, 100000]
      review_count: [0, 100000]
      personal_count: [0, 100000]
      skipped_count: [0, 100000]
      error_count: [0, 100000]

  practice_migration_committed:
    product: practice
    question: "Сколько записей реально перенеслось, сколько пропущено и сколько не удалось?"
    required: [source, imported_count, skipped_count, failed_count]
    optional: [provider]
    props:
      source: string
      provider: string
      imported_count: number
      skipped_count: number
      failed_count: number
    values:
      source: [calendar, spreadsheet]
      provider: [google, yandex, csv, xlsx, paste]
    range:
      imported_count: [0, 100000]
      skipped_count: [0, 100000]
      failed_count: [0, 100000]

  practice_migration_failed:
    product: practice
    question: "На чём ломается перенос практики?"
    required: [source, error_code]
    optional: [provider]
    props:
      source: string
      provider: string
      error_code: string
    values:
      source: [calendar, spreadsheet]
      provider: [google, yandex, csv, xlsx, paste]
      # Машинные категории, а не текст ошибки: сообщение исключения и тем
      # более строка импорта в аналитику не попадают никогда.
      error_code: [unauthorized, attestation_required, no_integration, provider_unavailable, invalid_input, commit_in_progress, internal_error]

  practice_booking_link_shared:
    product: practice
    question: "Делятся ли постоянной ссылкой записи — и с какой поверхности?"
    required: [source]
    optional: []
    props:
      source: string
    values:
      # Поверхность, а не адрес и не канал: сама ссылка сюда не попадает.
      source: [web, android]

  practice_booking_attempted:
    product: practice
    question: "Сколько попыток записи доходит до ядра бронирования?"
    required: [source]
    optional: []
    props:
      source: string
    values:
      source: [public_booking, known_client, reschedule]

  practice_booking_succeeded:
    product: practice
    question: "Сколько попыток записи заканчивается состоявшейся бронью?"
    required: [source]
    optional: []
    props:
      source: string
    values:
      source: [public_booking, known_client, reschedule]

  practice_booking_conflict:
    product: practice
    question: "На каких конфликтах разваливается запись?"
    required: [source, error_code]
    optional: []
    props:
      source: string
      error_code: string
    values:
      source: [public_booking, known_client, reschedule]
      # Те же коды, которыми уже живёт BookingConflictError — не дубль.
      #
      # INVALID_TOKEN здесь нет намеренно. Устаревшая ссылка отсекается ДО
      # попытки записи: события practice_booking_attempted для неё не было,
      # значит и конфликтом попытки она быть не может — иначе конфликтов
      # оказалось бы больше, чем попыток. Мёртвому значению в перечислении
      # не место; если проверка ссылки когда-нибудь переедет внутрь попытки,
      # код вернётся сюда вместе с ней.
      error_code: [SLOT_UNAVAILABLE, CLIENT_ALREADY_BOOKED, SESSION_NOT_FOUND]

  practice_attention_action_completed:
    product: practice
    question: "Какие пункты «требует внимания» доводят до конца, а не просто открывают?"
    required: [source]
    optional: []
    props:
      source: string
    values:
      # Вид проблемы, которую закрыли. Идентификатора сессии или клиента
      # здесь нет: событие о том, ЧТО закрыли, а не у кого.
      source: [session_without_notes, session_unpaid, client_without_consent]

  practice_onboarding_completed:
    product: practice
    question: "Доходят ли до пройденного чек-листа настройки практики?"
    required: []
    optional: []
