version: '3.8'

services:
  app:
    container_name: cmpas-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Add other env vars here or use env_file
    env_file:
      - .env.local
    # volumes:
      # - ./public/uploads:/app/public/uploads # Example for persisting uploads
