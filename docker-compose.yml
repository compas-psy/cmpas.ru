services:
  app:
    container_name: cmpas-app
    build:
      context: .
      dockerfile: Dockerfile
      # ОБЯЗАТЕЛЬНО. Без target собирается ПОСЛЕДНЯЯ стадия Dockerfile, а после
      # добавления сборщика показаний последней стала infra-pulse-collector —
      # и контейнер приложения превращался в сборщик: Next.js не стартовал,
      # проверка здоровья не проходила, выкладка падала и откатывалась.
      target: runner
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Корень Минцифры: сертификат платёжного шлюза Т-Банк выдан им, и без
      # этой связки Node внутри контейнера соединение отвергает.
      - NODE_EXTRA_CA_CERTS=/etc/ssl/ru-ca/russian-trusted.pem
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/cmpas_db
      - EMAIL_SERVER_HOST=mailer
      - EMAIL_SERVER_PORT=25
      - EMAIL_SERVER_USER=${EMAIL_SERVER_USER:-}
      - EMAIL_SERVER_PASSWORD=${EMAIL_SERVER_PASSWORD:-}
      - EMAIL_FROM=noreply@cmpas.ru
      - AUTH_TRUST_HOST=true
      - AUTH_URL=https://cmpas.ru
      - DADATA_API_KEY=${DADATA_API_KEY:-}
      - TELEGRAM_PROXY=${TELEGRAM_PROXY:-}
    env_file:
      - .env
    volumes:
      - uploaded_files:/app/public/uploads
      # Связку кладёт scripts/install-ru-ca.sh; только на чтение.
      - /etc/ssl/ru-ca:/etc/ssl/ru-ca:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailer:
        condition: service_started

  # Local HTTP/SOCKS proxy tunneling outbound traffic through a mieru VPN
  # server, used to reach api.telegram.org from a RU-hosted server (Telegram
  # is blocked/throttled from Russian IPs). Only started if the mieru
  # credentials are present in .env — see deploy-docker.yml. The app only
  # actually routes through it when the telegram_vpn_proxy admin flag is on
  # (/admin/features) — this container being up does not force proxying.
  singbox:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: cmpas-singbox
    restart: always
    profiles: ["vpn"]
    volumes:
      - ./deploy/singbox-config.json:/etc/sing-box/config.json:ro
    command: ["run", "-c", "/etc/sing-box/config.json"]

  # Технический пульс (O-260817-12, TZ_management_dashboard.md §9): собирает
  # показания сервера/контейнеров/базы/копий/рассылки/сертификата раз в 5
  # минут в таблицу InfraPulse. Отдельный процесс, не внутри сайта — падение
  # сборщика не задевает сайт, и наоборот. Только чтение: read-only docker
  # socket, read-only host-mounts (см. src/lib/infra-pulse/collector.ts —
  # только /proc и папка бэкапов, не весь хост целиком), БД-роль
  # infra_pulse_reader с SELECT везде и INSERT/DELETE только на свою же
  # таблицу InfraPulse (docker/init-postgres.sh, scripts/deploy-production-remote.sh).
  #
  # Не запускается в обычном `docker compose up` — `docker compose --profile infra-pulse up`,
  # тот же приём, что у singbox и reminders-worker.
  infra-pulse:
    container_name: cmpas-infra-pulse
    build:
      context: .
      dockerfile: Dockerfile
      target: infra-pulse-collector
    restart: always
    profiles: ["infra-pulse"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://infra_pulse_reader:${INFRA_PULSE_DB_PASSWORD:-}@postgres:5432/cmpas_db
      - INFRA_PULSE_CERT_HOST=cmpas.ru
      - INFRA_PULSE_CERT_HOST_ZAPISKI=zapiski.cmpas.ru
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/hostfs/proc:ro
      - /var/backups/cmpas:/hostfs/backups:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: cmpas-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cmpas_db
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh
    # Port 5432 is NOT exposed to host — app connects via Docker network.
    # Exposing it caused ISPManager to probe the DB as user "app" (which doesn't exist).
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d cmpas_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailer:
    image: boky/postfix
    container_name: cmpas-mailer
    restart: always
    environment:
      ALLOWED_SENDER_DOMAINS: cmpas.ru
    ports:
      - "25:25"
    volumes:
      - mail_queue:/var/spool/postfix

volumes:
  db_data:
  mail_queue:
  uploaded_files:
