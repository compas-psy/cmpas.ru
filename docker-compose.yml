services:
  app:
    container_name: cmpas-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/cmpas_db
      - EMAIL_SERVER_HOST=mailer
      - EMAIL_SERVER_PORT=25
      - EMAIL_SERVER_USER=${EMAIL_SERVER_USER:-}
      - EMAIL_SERVER_PASSWORD=${EMAIL_SERVER_PASSWORD:-}
      - EMAIL_FROM=noreply@cmpas.ru
      - AUTH_TRUST_HOST=true
      - AUTH_URL=https://cmpas.ru
      - DADATA_API_KEY=${DADATA_API_KEY:-}
      - TELEGRAM_PROXY=${TELEGRAM_PROXY:-}
    env_file:
      - .env
    volumes:
      - uploaded_files:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mailer:
        condition: service_started

  postgres:
    image: postgres:15-alpine
    container_name: cmpas-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cmpas_db
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh
    # Port 5432 is NOT exposed to host — app connects via Docker network.
    # Exposing it caused ISPManager to probe the DB as user "app" (which doesn't exist).
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d cmpas_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailer:
    image: boky/postfix
    container_name: cmpas-mailer
    restart: always
    environment:
      ALLOWED_SENDER_DOMAINS: cmpas.ru
    ports:
      - "25:25"
    volumes:
      - mail_queue:/var/spool/postfix

volumes:
  db_data:
  mail_queue:
  uploaded_files:
