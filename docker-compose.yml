services:
  app:
    container_name: cmpas-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/cmpas_db
      - EMAIL_SERVER_HOST=mailer
      - EMAIL_SERVER_PORT=25
      - EMAIL_SERVER_USER=
      - EMAIL_SERVER_PASSWORD=
      - EMAIL_FROM=noreply@cmpas.ru
      - YANDEX_CLIENT_ID=${YANDEX_CLIENT_ID}
      - YANDEX_CLIENT_SECRET=${YANDEX_CLIENT_SECRET}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - AUTH_URL=https://cmpas.ru
    env_file:
      - .env.local
      - .env

    depends_on:
      - postgres
      - mailer

  postgres:
    image: postgres:15-alpine
    container_name: cmpas-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cmpas_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # Exposed for local dev, should be restricted in prod if possible

  mailer:
    image: boky/postfix
    container_name: cmpas-mailer
    restart: always
    environment:
      ALLOWED_SENDER_DOMAINS: cmpas.ru
    ports:
      - "25:25"
    volumes:
      - mail_queue:/var/spool/postfix

volumes:
  db_data:
  mail_queue:
