<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему - cmpas.ru</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Yandex ID Suggest Button SDK (recommended: with polyfills, latest) -->
    <script src="https://yastatic.net/s3/passport-sdk/autofill/v1/sdk-suggest-with-polyfills-latest.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        
        .auth-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow:
                0 32px 64px rgba(0, 0, 0, 0.1),
                0 16px 32px rgba(0, 0, 0, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            max-width: 440px;
            width: 100%;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: containerFadeIn 0.8s ease-out;
        }

        @keyframes containerFadeIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        .logo-icon::before {
            content: '💬';
            font-size: 24px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #6b7280;
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .description {
            color: #9ca3af;
            font-size: 14px;
        }

        .form-section {
            margin-bottom: 32px;
        }

        .form-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 24px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 18px;
        }

        .phone-input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            background: #fafafa;
            transition: all 0.3s ease;
            outline: none;
        }

        .phone-input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .phone-input:valid {
            border-color: #10b981;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #6b7280;
            border: 2px solid #e5e7eb;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
            color: #374151;
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .status-message {
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            display: none;
            animation: statusSlideIn 0.3s ease-out;
        }

        @keyframes statusSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .status-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .status-loading {
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #dbeafe;
        }

        .footer {
            text-align: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e5e7eb;
        }

        .footer-text {
            color: #6b7280;
            font-size: 14px;
        }

        .footer-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .footer-link:hover {
            color: #5a67d8;
        }

        /* Адаптивность */
        @media (max-width: 480px) {
            .auth-container {
                padding: 32px 24px;
                margin: 16px;
                border-radius: 20px;
            }

            .logo-text {
                font-size: 20px;
            }

            .form-title {
                font-size: 16px;
            }
        }

        /* Анимации для интерактивности */
        .phone-input {
            animation: inputFocus 0.3s ease-out;
        }

        .btn {
            animation: buttonIdle 2s ease-in-out infinite;
        }

        @keyframes buttonIdle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* Заглушки для демо */
        .demo-notice {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #92400e;
            text-align: center;
        }
        
        /* ===== Design CSS from provided layout ===== */
        .container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            gap: 60px;
            padding: 40px;
            align-items: center;
        }

        .left-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .title {
            font-size: 64px;
            font-weight: 300;
            color: #1a1a1a;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 20px;
            color: #4a4a4a;
            margin-bottom: 60px;
            text-align: center;
        }

        .auth-form {
            background-color: #2d5f4f;
            border-radius: 24px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .yandex-btn {
            width: 100%;
            padding: 16px;
            background-color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            color: #1a1a1a;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
            transition: background-color 0.2s;
        }

        .yandex-btn:hover {
            background-color: #f5f5f5;
        }
        /* Иконка Яндекса внутри нашей кнопки (используйте <img class="yandex-logo">) */
        .yandex-logo {
            width: 32px;
            height: 32px;
            display: inline-block;
            object-fit: contain;
        }

        .cmpas-logo{
            height: 64px;
            display:inline;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .divider {
            text-align: center;
            color: #ffffff;
            font-size: 14px;
            margin: 24px 0;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.3);
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .phone-input {
            width: 100%;
            padding: 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 16px;
            background-color: #ffffff;
            color: #1a1a1a;
            outline: none;
        }

        .phone-input::placeholder {
            color: rgba(26, 26, 26, 0.5);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background-color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            color: #2d5f4f;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit-btn:hover { background-color: #f0f0f0; }

        .privacy-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            text-align: center;
            margin-top: 20px;
        }

        .privacy-text a { color: #ffffff; text-decoration: underline; }

        .right-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-container {
            width: 100%;
            max-width: 600px;
            height: 600px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 24px;
            font-weight: 300;
            overflow: hidden;
        }

        .placeholder-image { width: 100%; height: 100%; object-fit: cover; }

        @media (max-width: 1024px) {
            .container { flex-direction: column; }
            .title { font-size: 48px; }
            .image-container { height: 400px; }
        }
        /* ===== End design CSS ===== */
        /* Минимальная высота контейнера кнопки Яндекса, чтобы избежать скачков верстки */
        #buttonContainerId { min-height: 44px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <img src="/static/images/cmpas_logo_.svg" class="cmpas-logo" alt="Logo" >
            <!-- <h1 class="title">Компас</h1> -->
                    <div class="auth-form">
                <div id="buttonContainerId" style="margin-bottom: 12px;"></div>
                <button class="yandex-btn" type="button" id="yandexBtn">
                    <img id="yandexLogoImg" class="yandex-logo" alt="Yandex" data-src="/static/images/Yandex_icon.svg.png">
                    Продолжить с Яндекс
                </button>
                <div class="divider">ИЛИ</div>
                
                <form id="emailAuthForm">
                    <input type="email" class="phone-input" id="email" placeholder="Введите email" required>
                    <button class="submit-btn" type="submit" id="submitBtn">Продолжить по email</button>
                </form>

                <div id="otpSection" style="display: none; margin-top: 16px;">
                    <input type="text" class="phone-input" id="otpCode" placeholder="123456" maxlength="6" required>
                    <div style="display: flex; gap: 12px; margin-top: 12px;">
                        <button type="button" class="submit-btn" id="backBtn">Назад</button>
                        <button type="button" class="submit-btn" id="verifyBtn">Войти</button>
                    </div>
                </div>

                <div id="statusMessage" class="privacy-text" style="display: none; margin-top: 12px;"></div>

                <div class="privacy-text" style="margin-top:8px; display:flex; justify-content:center;">
                    <label id="marketingConsentRow" for="marketingConsent" style="display:none; align-items:center; gap:6px; cursor:pointer; text-align:left; margin-left: 12px;">
                        <input type="checkbox" id="marketingConsent" style="margin-left:-6px; flex-shrink:0; transform: scale(1.2);">
                        <span style="text-align:left;">Даю&nbsp;<a href="/static/legal/advertising.pdf" target="_blank" rel="noopener">согласие</a>&nbsp;на получение рекламных и информационных материалов</span>
                    </label>
                </div>

                <p class="privacy-text">
                    Продолжая, вы соглашаетесь с <a href="/static/legal/terms.pdf" target="_blank" rel="noopener">Пользовательским соглашением</a>
                    и <a href="/static/legal/privacy.pdf" target="_blank" rel="noopener">Политикой конфиденциальности</a>
                </p>

                <!-- Кнопка "Продолжить" под согласиями -->
                <button type="button" class="submit-btn" id="continueBtn" style="display:none; margin-top: 12px;">Продолжить</button>

            </div>
        </div>

         <div class="right-section">
            <div class="image-container">
                <img src="/static/images/login_back_3.png" alt="Placeholder" class="placeholder-image">
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.hide();

        // Элементы DOM
        const emailAuthForm = document.getElementById('emailAuthForm');
        const otpSection = document.getElementById('otpSection');
        const emailInput = document.getElementById('email');
        const otpInput = document.getElementById('otpCode');
        const submitBtn = document.getElementById('submitBtn');
        const verifyBtn = document.getElementById('verifyBtn');
        const backBtn = document.getElementById('backBtn');
        const statusMessage = document.getElementById('statusMessage');
        const yandexBtn = document.getElementById('yandexBtn');
        const buttonContainer = document.getElementById('buttonContainerId');
        const continueBtn = document.getElementById('continueBtn');
        let yaRemovalObserver = null;
        let postAuthMode = false;
        const CONSENT_PREF_KEY = 'marketing_consent_pref';
        const marketingConsentCheckbox = document.getElementById('marketingConsent');
        const marketingConsentRow = document.getElementById('marketingConsentRow');

        function getStoredMarketingPref() {
            try { return localStorage.getItem(CONSENT_PREF_KEY) === 'true'; } catch (_) { return false; }
        }
        function storeMarketingPref(value) {
            try { localStorage.setItem(CONSENT_PREF_KEY, value ? 'true' : 'false'); } catch (_) {}
        }

        async function ensureMarketingPreferenceSynced() {
            let token = '';
            try { token = localStorage.getItem('access_token') || ''; } catch (_) {}
            if (!token || !marketingConsentCheckbox) return;
            try {
                if (marketingConsentCheckbox.checked) {
                    await fetch('/api/v1/consents/advertising/accept', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ document_id: null })
                    });
                } else {
                    await fetch('/api/v1/consents/advertising/withdraw', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                }
            } catch (_) { /* ignore */ }
        }

        function enterPostAuthMode() {
            postAuthMode = true;
            if (yaRemovalObserver) { try { yaRemovalObserver.disconnect(); } catch(_) {} yaRemovalObserver = null; }
            if (buttonContainer) { buttonContainer.style.display = 'none'; try { buttonContainer.innerHTML = ''; } catch(_) {} }
            if (yandexBtn) yandexBtn.style.display = 'none';
            const dividerEl = document.querySelector('.divider');
            if (dividerEl) dividerEl.style.display = 'none';
            if (emailAuthForm) emailAuthForm.style.display = 'none';
            if (otpSection) otpSection.style.display = 'none';
            if (continueBtn) continueBtn.style.display = '';
            try {
                if (marketingConsentRow && marketingConsentRow.style.display !== 'none') {
                    marketingConsentRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else if (continueBtn) {
                    continueBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            } catch (_) {}
        }

        async function hideMarketingRowIfAlreadyConsented() {
            if (!marketingConsentRow) return;
            let token = '';
            try { token = localStorage.getItem('access_token') || ''; } catch (_) {}
            if (!postAuthMode || !token) { marketingConsentRow.style.display = 'none'; return; }
            try {
                const resp = await fetch('/api/v1/consents/', { headers: { 'Authorization': `Bearer ${token}` } });
                if (!resp.ok) { marketingConsentRow.style.display = 'none'; return; }
                const list = await resp.json();
                const adv = Array.isArray(list) ? list.find(x => x && (x.type === 'advertising' || (x.type && String(x.type).toLowerCase() === 'advertising'))) : null;
                if (adv && adv.accepted) {
                    marketingConsentRow.style.display = 'none';
                } else {
                    marketingConsentRow.style.display = 'inline-flex';
                }
            } catch (_) {
                marketingConsentRow.style.display = 'none';
            }
        }

        if (marketingConsentCheckbox) {
            marketingConsentCheckbox.checked = false;
            marketingConsentCheckbox.addEventListener('change', async () => {
                storeMarketingPref(marketingConsentCheckbox.checked);
                await ensureMarketingPreferenceSynced();
                await hideMarketingRowIfAlreadyConsented();
            });
        }

        async function processMarketingConsent() {
            const want = getStoredMarketingPref();
            if (!want) return;
            let token = '';
            try { token = localStorage.getItem('access_token') || ''; } catch (_) {}
            if (!token) return;
            try {
                await fetch('/api/v1/consents/advertising/accept', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ document_id: null })
                });
            } catch (_) { /* ignore opt-in errors */ }
        }

        // UI config from backend
        let uiConfig = { yandex_button_mode: 'native', app_main_url: '/' };
        async function fetchUiConfig() {
            try {
                const resp = await fetch('/api/v1/system/ui-config');
                if (resp.ok) {
                    const data = await resp.json();
                    if (data && typeof data === 'object') uiConfig = data;
                }
            } catch (_) { /* ignore */ }
        }

        // Suitable environment for native Yandex widget in dev
        function isSuitableForNative() {
            // В деве Яндекс требует именно https://localhost без порта (443)
            const isHttps = window.location.protocol === 'https:';
            const isLocalhost = window.location.hostname === 'localhost';
            const isDefaultPort = window.location.port === '' || window.location.port === '443';
            return isHttps && isLocalhost && isDefaultPort;
        }

        // Set Yandex logo image if provided via data-src
        function setupYandexLogo() {
            const img = document.getElementById('yandexLogoImg');
            if (img) {
                const src = img.getAttribute('data-src');
                if (src) img.src = src;
            }
        }

        function hasLocalSession() {
            try {
                return !!(localStorage.getItem('access_token') || localStorage.getItem('refresh_token'));
            } catch (_) {
                return false;
            }
        }

        // Parse URL fragment (after '#') to extract tokens returned from Yandex OAuth callback
        function parseHashParams() {
            try {
                const hash = window.location.hash ? window.location.hash.substring(1) : '';
                const sp = new URLSearchParams(hash);
                return {
                    access_token: sp.get('access_token') || '',
                    refresh_token: sp.get('refresh_token') || '',
                    token_type: sp.get('token_type') || '',
                    state: sp.get('state') || ''
                };
            } catch (_) {
                return { access_token: '', refresh_token: '', token_type: '', state: '' };
            }
        }

        function hasYaWidget() {
            return !!(buttonContainer && buttonContainer.children && buttonContainer.children.length > 0);
        }

        function hideFallback() { if (yandexBtn) yandexBtn.style.display = 'none'; }
        function showFallback() { if (postAuthMode) return; if (yandexBtn) yandexBtn.style.display = ''; }

        // Ждем рендера виджета ограниченное время
        function waitForYaWidget(timeoutMs = 2000) {
            return new Promise(resolve => {
                if (hasYaWidget()) return resolve(true);
                const obs = new MutationObserver(() => {
                    if (hasYaWidget()) {
                        obs.disconnect();
                        resolve(true);
                    }
                });
                if (buttonContainer) {
                    obs.observe(buttonContainer, { childList: true, subtree: true });
                }
                setTimeout(() => {
                    try { obs.disconnect(); } catch(_) {}
                    resolve(hasYaWidget());
                }, timeoutMs);
            });
        }

        function attachYaRemovalObserver() {
            if (!buttonContainer) return;
            if (yaRemovalObserver) return;
            yaRemovalObserver = new MutationObserver(() => {
                if (!hasYaWidget()) {
                    if (postAuthMode) return;
                    console.debug('[YaAuthSuggest] widget removed, showing fallback');
                    showFallback();
                }
            });
            yaRemovalObserver.observe(buttonContainer, { childList: true, subtree: true });
        }

        let currentEmail = '';

        // Запуск авторизации через Яндекс ID по кнопке
        if (yandexBtn) {
            yandexBtn.addEventListener('click', async function () {
                try {
                    // Редиректим на эндпоинт, который сформирует URL и отправит на Яндекс
                    window.location.href = '/api/v1/auth/yandex/authorize';
                } catch (e) {
                    console.error('Yandex auth start error:', e);
                    showStatus('Не удалось начать авторизацию через Яндекс', 'error');
                }
            });
        }

        // Инициализация кнопки Яндекс ID (YaAuthSuggest)
        async function initYaAuthButton() {
            try {
                const resp = await fetch('/api/v1/auth/yandex/login');
                const data = await resp.json();
                const authorizeUrl = data && data.authorize_url ? data.authorize_url : null;
                if (!authorizeUrl) {
                    console.warn('authorize_url не получен; используем резервную кнопку.');
                    return;
                }

                const u = new URL(authorizeUrl);
                const rawScope = u.searchParams.get('scope') || '';
                const normalizedScope = rawScope.replace(/\+/g, ' ');
                const oauthQueryParams = {
                    response_type: u.searchParams.get('response_type') || 'code',
                    client_id: u.searchParams.get('client_id') || '',
                    redirect_uri: u.searchParams.get('redirect_uri') || '',
                    scope: normalizedScope,
                };
                const tokenPageOrigin = window.location.origin;
                console.debug('[YaAuthSuggest] oauthQueryParams:', oauthQueryParams, 'origin:', tokenPageOrigin);

                if (window.YaAuthSuggest && typeof window.YaAuthSuggest.init === 'function') {
                    window.YaAuthSuggest
                        .init(
                            oauthQueryParams,
                            tokenPageOrigin,
                            {
                                view: "button",
                                parentId: "buttonContainerId",
                                buttonSize: 'xs',
                                buttonView: 'main',
                                buttonTheme: 'light',
                                buttonBorderRadius: 12,
                                buttonIcon: 'ya',
                            }
                        )
                        .then(() => waitForYaWidget(2000))
                        .then(rendered => {
                            if (rendered) {
                                console.debug('[YaAuthSuggest] widget rendered');
                                hideFallback();
                                attachYaRemovalObserver();
                            } else {
                                console.debug('[YaAuthSuggest] widget not rendered in time, show fallback');
                                showFallback();
                            }
                        })
                        .then(data => {
                            console.log('Сообщение с токеном', data);
                        })
                        .catch(error => {
                            console.log('Обработка ошибки', error);
                            // Если что-то пошло не так — показываем резервную кнопку
                            showFallback();
                        });
                } else {
                    console.warn('YaAuthSuggest не найден; используем резервную кнопку.');
                    showFallback();
                }
            } catch (err) {
                console.error('Ошибка инициализации YaAuthSuggest:', err);
                showFallback();
            }
        }

        // Дождёмся загрузки страницы и SDK, чтобы виджет гарантированно инициализировался
        function whenYaAuthReady(timeoutMs = 5000) {
            return new Promise((resolve, reject) => {
                const ready = () => (window.YaAuthSuggest && typeof window.YaAuthSuggest.init === 'function');
                if (ready()) return resolve();
                const start = Date.now();
                const iv = setInterval(() => {
                    if (ready()) {
                        clearInterval(iv);
                        resolve();
                    } else if (Date.now() - start > timeoutMs) {
                        clearInterval(iv);
                        reject(new Error('YaAuthSuggest not loaded in time'));
                    }
                }, 100);
            });
        }

        window.addEventListener('load', async () => {
            setupYandexLogo();
            await fetchUiConfig();
            await hideMarketingRowIfAlreadyConsented();

            // Handle success return from Yandex OAuth (tokens in URL fragment)
            try {
                const frag = parseHashParams();
                if (frag.access_token && frag.refresh_token) {
                    try {
                        localStorage.setItem('access_token', frag.access_token);
                        localStorage.setItem('refresh_token', frag.refresh_token);
                    } catch (_) { /* ignore storage issues */ }
                    enterPostAuthMode();
                    await hideMarketingRowIfAlreadyConsented();

                    showStatus('Авторизация через Яндекс успешна! Добро пожаловать в cmpas.ru!', 'success');
                    tg.MainButton.setText('Готово');
                    tg.MainButton.show();

                    if (continueBtn) {
                        const url = (uiConfig && uiConfig.app_main_url) ? uiConfig.app_main_url : '/';
                        continueBtn.onclick = async () => {
                            await ensureMarketingPreferenceSynced();
                            window.location.href = url;
                        };
                    }

                    // Clear URL fragment to avoid re-processing on refresh
                    try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch (_) {}
                }
            } catch (_) { /* ignore */ }

            // Не показываем "Продолжить" на основании локальных токенов.
            // Кнопка появится только после успешной авторизации (Яндекс/Email).

            const preferNative = (uiConfig && uiConfig.yandex_button_mode || 'native') === 'native';
            const suitableEnv = isSuitableForNative();

            if (preferNative && suitableEnv) {
                // На старте скрываем резервную кнопку, ждём рендера виджета
                hideFallback();
                try {
                    await whenYaAuthReady();
                } catch (e) {
                    console.warn('YaAuthSuggest не загрузился вовремя:', e);
                } finally {
                    initYaAuthButton();
                }
                // Если виджет так и не появится — покажем резервную кнопку чуть позже
                setTimeout(async () => {
                    if (!hasYaWidget()) showFallback();
                }, 1500);
            } else {
                // Используем только кастомную кнопку
                showFallback();
                if (buttonContainer) buttonContainer.style.display = 'none';
            }
        });

        // Функции показа/скрытия статусов
        function showStatus(message, type = 'info') {
            statusMessage.textContent = message;
            statusMessage.className = `status-message status-${type}`;
            statusMessage.style.display = 'block';

            // Автоматически скрываем через 5 секунд
            setTimeout(() => {
                statusMessage.style.display = 'none';
            }, 5000);
        }

        function clearStatus() {
            statusMessage.style.display = 'none';
        }

        // Валидация email
        function validateEmail(email) {
            return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email);
        }

        // Обработка формы email аутентификации
        emailAuthForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            clearStatus();

            const email = emailInput.value.trim().toLowerCase();
            if (!validateEmail(email)) {
                showStatus('Введите корректный email', 'error');
                return;
            }

            currentEmail = email;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Отправляем...';

            try {
                // Отправляем запрос на сервер
                const response = await fetch('/api/v1/auth/email/initiate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus('Код подтверждения отправлен на ваш email!', 'success');
                    emailAuthForm.style.display = 'none';
                    otpSection.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Отправить снова';
                } else {
                    throw new Error(data.detail || 'Ошибка при отправке');
                }

            } catch (error) {
                console.error('Auth error:', error);
                showStatus('Ошибка при отправке запроса. Попробуйте еще раз.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Получить код';
            }
        });

        // Верификация OTP кода
        verifyBtn.addEventListener('click', async function() {
            const otpCode = otpInput.value.trim();
            if (otpCode.length !== 6) {
                showStatus('Введите 6-значный код подтверждения', 'error');
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Проверяем...';

            try {
                const response = await fetch('/api/v1/auth/email/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: currentEmail,
                        otp_code: otpCode
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus('Авторизация успешна! Добро пожаловать в cmpas.ru!', 'success');
                    try {
                        localStorage.setItem('access_token', data.access_token);
                        localStorage.setItem('refresh_token', data.refresh_token);
                    } catch (e) { /* no-op if storage unavailable */ }

                    enterPostAuthMode();
                    await processMarketingConsent();
                    await hideMarketingRowIfAlreadyConsented();

                    // Показываем кнопку завершения в Telegram
                    tg.MainButton.setText('Готово');
                    tg.MainButton.show();

                    if (continueBtn) {
                        const url = (uiConfig && uiConfig.app_main_url) ? uiConfig.app_main_url : '/';
                        continueBtn.onclick = async () => {
                            await ensureMarketingPreferenceSynced();
                            window.location.href = url;
                        };
                    }

                    console.log('Успешная авторизация:', data);
                } else {
                    throw new Error(data.detail || 'Ошибка верификации');
                }

            } catch (error) {
                console.error('Verification error:', error);
                showStatus('Неверный код подтверждения. Попробуйте еще раз.', 'error');
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Войти';
            }
        });

        // Кнопка назад
        backBtn.addEventListener('click', function() {
            otpSection.style.display = 'none';
            emailAuthForm.style.display = 'block';
            clearStatus();
            otpInput.value = '';
        });

        // Обработка главной кнопки Telegram
        tg.MainButton.onClick(function() {
            tg.close();
        });

        // Закрытие приложения по кнопке "Назад"
        tg.BackButton.show();
        tg.BackButton.onClick(function() {
            if (otpSection.style.display !== 'none') {
                otpSection.style.display = 'none';
                phoneAuthForm.style.display = 'block';
                clearStatus();
            } else {
                tg.close();
            }
        });

        // Добавляем плавные анимации для интерактивности
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function() {
                this.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 150);
            });
        });
    </script>
</body>
</html>
