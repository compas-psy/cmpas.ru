<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему - cmpas.ru</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        
        .auth-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow:
                0 32px 64px rgba(0, 0, 0, 0.1),
                0 16px 32px rgba(0, 0, 0, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            max-width: 440px;
            width: 100%;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: containerFadeIn 0.8s ease-out;
        }

        @keyframes containerFadeIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        .logo-icon::before {
            content: '💬';
            font-size: 24px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #6b7280;
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .description {
            color: #9ca3af;
            font-size: 14px;
        }

        .form-section {
            margin-bottom: 32px;
        }

        .form-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 24px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 18px;
        }

        .phone-input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            background: #fafafa;
            transition: all 0.3s ease;
            outline: none;
        }

        .phone-input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .phone-input:valid {
            border-color: #10b981;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #6b7280;
            border: 2px solid #e5e7eb;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
            color: #374151;
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .status-message {
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            display: none;
            animation: statusSlideIn 0.3s ease-out;
        }

        @keyframes statusSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .status-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .status-loading {
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #dbeafe;
        }

        .footer {
            text-align: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e5e7eb;
        }

        .footer-text {
            color: #6b7280;
            font-size: 14px;
        }

        .footer-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .footer-link:hover {
            color: #5a67d8;
        }

        /* Адаптивность */
        @media (max-width: 480px) {
            .auth-container {
                padding: 32px 24px;
                margin: 16px;
                border-radius: 20px;
            }

            .logo-text {
                font-size: 20px;
            }

            .form-title {
                font-size: 16px;
            }
        }

        /* Анимации для интерактивности */
        .phone-input {
            animation: inputFocus 0.3s ease-out;
        }

        .btn {
            animation: buttonIdle 2s ease-in-out infinite;
        }

        @keyframes buttonIdle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* Заглушки для демо */
        .demo-notice {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #92400e;
            text-align: center;
        }
        
        /* ===== Design CSS from provided layout ===== */
        .container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            gap: 60px;
            padding: 40px;
            align-items: center;
        }

        .left-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .title {
            font-size: 64px;
            font-weight: 300;
            color: #1a1a1a;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 20px;
            color: #4a4a4a;
            margin-bottom: 60px;
            text-align: center;
        }

        .auth-form {
            background-color: #2d5f4f;
            border-radius: 24px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .yandex-btn {
            width: 100%;
            padding: 16px;
            background-color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            color: #1a1a1a;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
            transition: background-color 0.2s;
        }

        .yandex-btn:hover {
            background-color: #f5f5f5;
        }

        .yandex-icon {
            width: 20px;
            height: 20px;
            background-color: #ff0000;
            border-radius: 50%;
        }

        .divider {
            text-align: center;
            color: #ffffff;
            font-size: 14px;
            margin: 24px 0;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.3);
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .phone-input {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 16px;
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            outline: none;
        }

        .phone-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background-color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            color: #2d5f4f;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit-btn:hover { background-color: #f0f0f0; }

        .privacy-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            text-align: center;
            margin-top: 20px;
        }

        .privacy-text a { color: #ffffff; text-decoration: underline; }

        .right-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-container {
            width: 100%;
            max-width: 600px;
            height: 600px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 24px;
            font-weight: 300;
            overflow: hidden;
        }

        .placeholder-image { width: 100%; height: 100%; object-fit: cover; }

        @media (max-width: 1024px) {
            .container { flex-direction: column; }
            .title { font-size: 48px; }
            .image-container { height: 400px; }
        }
        /* ===== End design CSS ===== */
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <h1 class="title">Невозможное?<br>Возможно.</h1>
            <p class="subtitle">ИИ для решения задач</p>

            <div class="auth-form">
                <button class="yandex-btn" type="button" id="yandexBtn">
                    <div class="yandex-icon"></div>
                    Продолжить с Яндекс
                </button>
                <div class="divider">ИЛИ</div>
                
                <form id="emailAuthForm">
                    <input type="email" class="phone-input" id="email" placeholder="Введите email" required>
                    <button class="submit-btn" type="submit" id="submitBtn">Продолжить по email</button>
                </form>

                <div id="otpSection" style="display: none; margin-top: 16px;">
                    <input type="text" class="phone-input" id="otpCode" placeholder="123456" maxlength="6" required>
                    <div style="display: flex; gap: 12px; margin-top: 12px;">
                        <button type="button" class="submit-btn" id="backBtn">Назад</button>
                        <button type="button" class="submit-btn" id="verifyBtn">Войти</button>
                    </div>
                </div>

                <div id="statusMessage" class="privacy-text" style="display: none; margin-top: 12px;"></div>

                <p class="privacy-text">
                    Продолжая, вы соглашаетесь с <a href="#">Политикой конфиденциальности</a>
                </p>
            </div>
        </div>

        <div class="right-section">
            <div class="image-container">
                <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=800&h=800&fit=crop" alt="Placeholder" class="placeholder-image">
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.hide();

        // Элементы DOM
        const emailAuthForm = document.getElementById('emailAuthForm');
        const otpSection = document.getElementById('otpSection');
        const emailInput = document.getElementById('email');
        const otpInput = document.getElementById('otpCode');
        const submitBtn = document.getElementById('submitBtn');
        const verifyBtn = document.getElementById('verifyBtn');
        const backBtn = document.getElementById('backBtn');
        const statusMessage = document.getElementById('statusMessage');

        let currentEmail = '';

        // Функции показа/скрытия статусов
        function showStatus(message, type = 'info') {
            statusMessage.textContent = message;
            statusMessage.className = `status-message status-${type}`;
            statusMessage.style.display = 'block';

            // Автоматически скрываем через 5 секунд
            setTimeout(() => {
                statusMessage.style.display = 'none';
            }, 5000);
        }

        function clearStatus() {
            statusMessage.style.display = 'none';
        }

        // Валидация email
        function validateEmail(email) {
            return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email);
        }

        // Обработка формы email аутентификации
        emailAuthForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            clearStatus();

            const email = emailInput.value.trim().toLowerCase();
            if (!validateEmail(email)) {
                showStatus('Введите корректный email', 'error');
                return;
            }

            currentEmail = email;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Отправляем...';

            try {
                // Отправляем запрос на сервер
                const response = await fetch('/api/v1/auth/email/initiate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus('Код подтверждения отправлен на ваш email!', 'success');
                    emailAuthForm.style.display = 'none';
                    otpSection.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Отправить снова';
                } else {
                    throw new Error(data.detail || 'Ошибка при отправке');
                }

            } catch (error) {
                console.error('Auth error:', error);
                showStatus('Ошибка при отправке запроса. Попробуйте еще раз.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Получить код';
            }
        });

        // Верификация OTP кода
        verifyBtn.addEventListener('click', async function() {
            const otpCode = otpInput.value.trim();
            if (otpCode.length !== 6) {
                showStatus('Введите 6-значный код подтверждения', 'error');
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Проверяем...';

            try {
                const response = await fetch('/api/v1/auth/email/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: currentEmail,
                        otp_code: otpCode
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus('Авторизация успешна! Добро пожаловать в cmpas.ru!', 'success');
                    try {
                        localStorage.setItem('access_token', data.access_token);
                        localStorage.setItem('refresh_token', data.refresh_token);
                    } catch (e) { /* no-op if storage unavailable */ }

                    // Показываем кнопку завершения в Telegram
                    tg.MainButton.setText('Готово');
                    tg.MainButton.show();

                    console.log('Успешная авторизация:', data);
                } else {
                    throw new Error(data.detail || 'Ошибка верификации');
                }

            } catch (error) {
                console.error('Verification error:', error);
                showStatus('Неверный код подтверждения. Попробуйте еще раз.', 'error');
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Войти';
            }
        });

        // Кнопка назад
        backBtn.addEventListener('click', function() {
            otpSection.style.display = 'none';
            emailAuthForm.style.display = 'block';
            clearStatus();
            otpInput.value = '';
        });

        // Обработка главной кнопки Telegram
        tg.MainButton.onClick(function() {
            tg.close();
        });

        // Закрытие приложения по кнопке "Назад"
        tg.BackButton.show();
        tg.BackButton.onClick(function() {
            if (otpSection.style.display !== 'none') {
                otpSection.style.display = 'none';
                phoneAuthForm.style.display = 'block';
                clearStatus();
            } else {
                tg.close();
            }
        });

        // Добавляем плавные анимации для интерактивности
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function() {
                this.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 150);
            });
        });
    </script>
</body>
</html>
